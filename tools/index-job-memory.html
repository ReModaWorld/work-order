justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;font-size:12px;font-weight:750;color:var(--muted)}h1{font-size:29px;letter-spacing:-.8px;margin:3px 0 2px;line-height:1.25}h2{font-size:19px;letter-spacing:-.3px;margin:0 0 15px}h3{font-size:16px;margin:0 0 8px}p{margin:6px 0 15px}.muted{color:var(--muted)}.sub{font-size:14px;color:var(--muted)}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:24px;min-width:0}.stat .value{font-size:29px;letter-spacing:-.9px;font-weight:720;margin:12px 0 5px;font-variant-numeric:tabular-nums}.stat .label{font-size:14px;color:var(--muted)}.stat.feature{background:var(--navy);color:white;border-color:var(--navy)}.stat.feature .label,.stat.feature .sub{color:#bfc9dd}.split{display:grid;grid-template-columns:1.65fr 1fr;gap:20px;margin-top:24px}.section{margin-top:24px}.banner{padding:16px 20px;border-radius:11px;background:var(--purple-soft);color:#4c358c;margin-bottom:22px;font-size:14px}.warning{background:#fff3e4;color:#844d13}.bad{color:var(--red)}.good{color:var(--green)}.pill{border-radius:20px;display:inline-block;padding:4px 10px;font-size:12px;font-weight:700;background:#edf0f5;color:#506078}.pill.sold{background:#e8f5ef;color:var(--green)}.pill.draft{background:var(--purple-soft);color:var(--purple)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:var(--muted);font-size:12px;letter-spacing:.5px;text-transform:uppercase;padding:13px 12px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:16px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.empty{text-align:center;padding:36px 20px}.empty .empty-icon{margin:0 auto 16px;width:56px;height:56px;background:var(--purple-soft);color:var(--purple);border-radius:16px;display:grid;place-items:center}.empty p{max-width:480px;margin:8px auto 22px;color:var(--muted)}.steps{display:grid;gap:22px}.step{display:flex;gap:14px}.step b.number{width:30px;height:30px;border-radius:50%;background:var(--purple-soft);color:var(--purple);display:grid;place-items:center;flex-shrink:0;font-size:14px}.step p{font-size:14px;color:var(--muted);margin:0}.toolbar{display:flex;gap:12px;margin-bottom:18px}.toolbar input{max-width:340px}.toolbar select{width:auto}.row{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.progress{height:7px;background:#e9edf4;border-radius:10px;overflow:hidden;margin:14px 0 8px}.progress span{display:block;height:100%;background:var(--purple)}label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cdd5e1;border-radius:8px;background:white;color:var(--ink);min-width:0}input[type=checkbox]{width:18px;height:18px;accent-color:var(--purple)}textarea{min-height:86px;resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-bottom:16px}.span2{grid-column:1/-1}.hint{font-size:13px;color:var(--muted);margin-top:5px}.costline{display:grid;grid-template-columns:130px 1fr 110px 42px;gap:8px;margin-bottom:10px}.costhead{font-size:12px;color:var(--muted)}dialog{border:0;border-radius:17px;width:min(860px,calc(100% - 24px));padding:0;max-height:90dvh;color:var(--ink);box-shadow:0 24px 100px #0004}dialog::backdrop{background:#0c152875;backdrop-filter:blur(3px)}.modal-head{position:sticky;top:0;background:white;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:20px 26px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0}.modal-body{padding:24px 26px}.modal-foot{display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:white;border-top:1px solid var(--line);padding:16px 26px;z-index:2}.live-plan{background:var(--bg);padding:18px;border-radius:10px;margin-top:20px}.live-plan .grid{gap:12px}.live-plan strong{display:block;font-size:20px}.error{color:var(--red);background:#fff0f0;padding:12px;border-radius:8px;margin:0 0 16px}.error:empty{display:none}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:12px 22px;border-radius:10px;z-index:20;max-width:92vw;box-shadow:0 8px 24px #0002}#toast:empty{display:none}.checkrow{display:flex;gap:10px;align-items:center}.nowrap{white-space:nowrap}.print-only{display:none}.footer-note{font-size:13px;color:var(--muted);margin-top:24px}.mini{font-size:13px}.job-title{font-size:15px;font-weight:650}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.transfer-box{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:24px 1fr 150px;gap:12px;align-items:center}

</style></head><body><header><div class="brand"><span class="mark">J</span><div>Job Money Planner <small id="business"></small></div></div><button id="backupTop">Export backup</button></header><div class="shell"><aside><div class="eyebrow" style="padding:0 12px 12px">Workspace</div><nav id="nav"></nav><div class="aside-foot"><b>Numbers you can trace.</b><p>Rule-based calculations.<br>No AI or bank connection.</p><span id="saveState">Saved on this browser</span></div></aside><main id="app"></main></div><dialog id="modal" aria-labelledby="modalTitle"></dialog><div id="toast" role="status" aria-live="polite"></div><div id="printArea" class="print-only"></div><input type="file" id="restoreFile" accept="application/json,.json" hidden>
<script>
'use strict';
/* Job Money Planner v1.0 — no dependencies. Modules: Money, Rules, Schema, Store, UI.
   Integration seam: window.JobMoneyPlanner exposes read-only copies and pure rules.
   Future ELA commands must be authenticated and validated by a secure backend.
   Never add API keys here. All current calculations are rule-based, not AI. */
const Money={cents(v){const n=Number(v);if(!Number.isFinite(n)||Math.abs(n)>1e9)throw Error('Enter a valid amount below 1 billion.');return Math.round((n+Number.EPSILON)*100)},fmt(v){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(v/100)},input(v){return(v/100).toFixed(2)}};
const uid=()=>globalThis.crypto?.randomUUID?.()||('id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((n,x)=>n+f(x),0);
const Rules={plan(p){const cost=sum(p.costs,x=>x.amount);const oh=p.ohBasis==='fixed'?p.ohValue:Math.round((p.ohBasis==='cost'?cost:p.sale)*p.ohValue/100);const profit=p.sale-cost-oh;return{cost,oh,profit,margin:p.sale?profit/p.sale*100:0}},suggest(p){const c=sum(p.costs,x=>x.amount);const r=p.profitValue/100;const of=p.ohBasis==='sale'?p.ohValue/100:0;const base=c+(p.ohBasis==='fixed'?p.ohValue:p.ohBasis==='cost'?Math.round(c*p.ohValue/100):0);const divisor=p.profitBasis==='margin'?1-of-r:1-of*(1+r);if(divisor<=0)throw Error('These percentages leave no room for costs. Reduce the overhead or profit percentage.');return Math.round(base*(p.profitBasis==='markup'?1+r:1)/divisor)},job(j,db){const p=Rules.plan(j.plan);const received=sum(j.payments.filter(x=>!x.voided),x=>x.amount);const transferred=sum(db.transfers.filter(x=>!x.voided),t=>sum(t.lines.filter(x=>x.jobId===j.id),x=>x.amount));const funded=j.status==='draft'?0:Math.min(p.oh,j.plan.allocation==='first'?Math.max(0,received):Math.round(p.oh*Math.min(1,Math.max(0,received)/Math.max(1,j.plan.sale))));return{...p,received,transferred,funded,ready:Math.max(0,funded-transferred),over:Math.max(0,transferred-funded),awaiting:Math.max(0,p.oh-funded),balance:Math.max(0,j.plan.sale-received)}}};
const defaults=()=>({schemaVersion:1,revision:0,settings:{business:'ReModa',contact:'',account:'Overhead account',ohBasis:'cost',ohValue:10,profitBasis:'margin',profitValue:35,allocation:'proportional'},jobs:[],transfers:[],audit:[],lastBackup:null});
const Schema={validate(d){const fail=()=>{throw Error('This is not a valid Job Money Planner backup. No data was replaced.')};const str=(s,n=10000)=>typeof s==='string'&&s.length<=n;const cash=n=>Number.isSafeInteger(n)&&Math.abs(n)<=1e11;const date=s=>str(s,10)&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s+'T12:00:00Z'))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s;const plan=p=>p&&Array.isArray(p.costs)&&p.costs.length<=1000&&p.costs.every(x=>str(x.category,30)&&str(x.description)&&cash(x.amount)&&x.amount>=0)&&cash(p.sale)&&p.sale>=0&&['cost','sale','fixed'].includes(p.ohBasis)&&Number.isFinite(p.ohValue)&&p.ohValue>=0&&(p.ohBasis==='fixed'?cash(p.ohValue):p.ohValue<=1000)&&['margin','markup'].includes(p.profitBasis)&&Number.isFinite(p.profitValue)&&p.profitValue>=0&&p.profitValue<=1000&&['proportional','first'].includes(p.allocation);
if(!d||d.schemaVersion!==1||!Number.isSafeInteger(d.revision)||!d.settings||!str(d.settings.business,200)||!str(d.settings.contact)||!str(d.settings.account,200)||!Array.isArray(d.jobs)||d.jobs.length>10000||!Array.isArray(d.transfers)||d.transfers.length>50000||!Array.isArray(d.audit)||d.audit.length>100000)fail();if(!plan({costs:[],sale:0,ohBasis:d.settings.ohBasis,ohValue:d.settings.ohValue,profitBasis:d.settings.profitBasis,profitValue:d.settings.profitValue,allocation:d.settings.allocation})||(d.lastBackup!==null&&(!str(d.lastBackup)||isNaN(Date.parse(d.lastBackup)))))fail();const ids=new Set();for(const j of d.jobs){if(!str(j.id,100)||!/^[a-zA-Z0-9_-]+$/.test(j.id)||ids.has(j.id)||!str(j.name,200)||!str(j.client,200)||!str(j.notes)||!['draft','sold','complete'].includes(j.status)||!plan(j.plan)||!Array.isArray(j.revisions)||!j.revisions.every(r=>r&&plan(r.plan)&&str(r.reason)&&str(r.at))||!Array.isArray(j.payments)||!j.payments.every(p=>p&&str(p.id,100)&&cash(p.amount)&&p.amount!==0&&date(p.date)&&str(p.reference)&&str(p.note)&&typeof p.voided==='boolean'))fail();ids.add(j.id);const pids=new Set();for(const p of j.payments){if(!/^[a-zA-Z0-9_-]+$/.test(p.id)||pids.has(p.id))fail();pids.add(p.id)}const pp=Rules.plan(j.plan);if(j.status!=='draft'&&(j.plan.sale<=0||pp.oh>j.plan.sale))fail();if(sum(j.payments.filter(p=>!p.voided),p=>p.amount)<0)fail()}
const tids=new Set();for(const t of d.transfers){if(!t||!str(t.id,100)||!/^[a-zA-Z0-9_-]+$/.test(t.id)||tids.has(t.id)||!date(t.date)||!str(t.reference)||!str(t.note)||!str(t.account,200)||typeof t.voided!=='boolean'||!Array.isArray(t.lines)||!t.lines.length||!t.lines.every(l=>ids.has(l.jobId)&&cash(l.amount)&&l.amount>0))fail();if(new Set(t.lines.map(l=>l.jobId)).size!==t.lines.length)fail();tids.add(t.id)}if(!d.audit.every(a=>a&&str(a.at)&&str(a.message)))fail();return d}};
const Store={key:'job-money-planner-v1',db:defaults(),raw:null,blocked:false,load(){try{this.raw=localStorage.getItem(this.key);if(this.raw)this.db=Schema.validate(JSON.parse(this.raw))}catch(e){this.blocked=true;setTimeout(()=>toast('Saved data could not be opened. Export recovery data in Settings before restoring.'),300)}},commit(fn,message){if(this.blocked){toast('Saving is blocked. Recover your data in Settings first.');return false}try{const current=localStorage.getItem(this.key);if(current!==this.raw){toast('Another tab changed the data. Reload this page before saving.');return false}const next=structuredClone(this.db);fn(next);next.revision++;next.audit.push({at:new Date().toISOString(),message});Schema.validate(next);const raw=JSON.stringify(next);localStorage.setItem(this.key,raw);this.db=next;this.raw=raw;document.getElementById('saveState').textContent='Saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return true}catch(e){toast('Not saved: '+e.message);return false}}};
const icons={overview:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',jobs:'M4 6h16v15H4z M9 6V3h6v3 M4 11h16',transfers:'M3 7h17l-4-4 M21 17H4l4 4',activity:'M4 3h16v18H4z M8 8h8 M8 12h8 M8 16h5',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2'};const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${icons[k]||icons.jobs}"/></svg>`;
let view='overview',selected=null,filter='',statusFilter='all',modalDirty=false;let toastTimer;
function toast(s){document.getElementById('toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',6500)}
const btn=(text,action,id='',cls='')=>`<button class="${cls}" data-action="${action}" data-id="${esc(id)}">${text}</button>`;
const badge=s=>`<span class="pill ${s}">${s==='complete'?'Completed':s==='sold'?'Active':'Draft'}</span>`;
const empty=(title,desc,button='')=>`<div class="empty"><div class="empty-icon">${icon('jobs')}</div><h2>${title}</h2><p>${desc}</p>${button}</div>`;
function totals(){return Store.db.jobs.filter(j=>j.status!=='draft').reduce((a,j)=>{const r=Rules.job(j,Store.db);for(const k of Object.keys(a))a[k]+=r[k];return a},{ready:0,transferred:0,awaiting:0,over:0,received:0,oh:0,cost:0,profit:0})}
function stats(t){return `<div class="grid"><div class="card stat feature"><div class="label">Overhead ready to transfer</div><div class="value">${Money.fmt(t.ready)}</div><div class="sub">Funded by recorded payments</div></div><div class="card stat"><div class="label">Already transferred</div><div class="value">${Money.fmt(t.transferred)}</div><div class="sub">Recorded completed transfers</div></div><div class="card stat"><div class="label">Awaiting client payments</div><div class="value">${Money.fmt(t.awaiting)}</div><div class="sub">Overhead still to be funded</div></div><div class="card stat"><div class="label">Total overhead planned</div><div class="value">${Money.fmt(t.oh)}</div><div class="sub">Across sold and completed jobs</div></div></div>`}
function top(title,sub,actions=''){return `<div class="top"><div><div class="eyebrow">Job Money Planner</div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}
function jobsTable(jobs){return `<div class="table-wrap"><table><thead><tr><th>Job / client</th><th>Status</th><th class="num">Sale</th><th class="num">Received</th><th class="num">OH target</th><th class="num">Ready</th><th></th></tr></thead><tbody>${jobs.map(j=>{const r=Rules.job(j,Store.db);return `<tr><td><button class="link job-title" data-action="open" data-id="${esc(j.id)}">${esc(j.name)}</button><div class="sub">${esc(j.client)||'No client entered'}</div></td><td>${badge(j.status)}</td><td class="num">${Money.fmt(j.plan.sale)}</td><td class="num">${Money.fmt(r.received)}</td><td class="num">${Money.fmt(r.oh)}</td><td class="num ${r.over?'bad':'good'}">${r.over?'Review '+Money.fmt(r.over):Money.fmt(r.ready)}</td><td>${btn('Open','open',j.id,'small')}</td></tr>`}).join('')}</tbody></table></div>`}
function render(){document.getElementById('business').textContent=' / '+Store.db.settings.business;document.getElementById('nav').innerHTML=[['overview','Overview'],['jobs','Jobs & plans'],['transfers','Transfer center'],['activity','Activity'],['settings','Settings']].map(([k,s])=>`<button data-action="nav" data-id="${k}" class="${view===k?'active':''}" ${view===k?'aria-current="page"':''}>${icon(k)}${s}</button>`).join('');const app=document.getElementById('app');const t=totals();let content='';if(view==='overview'){content=top('Your job money, organized.','Keep every calculation. Know exactly what to set aside.',btn('+ New job','new','','primary'))+stats(t)+(t.over?`<div class="banner warning section">${Money.fmt(t.over)} is transferred above current funded allocations. Review affected jobs before making more transfers.</div>`:'')+`<div class="split"><div class="card"><div class="top" style="margin-bottom:8px"><h2>Job money at a glance</h2>${btn('View all jobs','nav','jobs','link')}</div>${Store.db.jobs.length?jobsTable(Store.db.jobs.slice(-5).reverse()):empty('Start with your next job','Save the costs and selling price in one place. When the client pays, your overhead allocation is ready.',btn('Create your first job','new','','primary'))}</div><div class="card"><h2>From estimate to transfer</h2><div class="steps"><div class="step"><b class="number">1</b><div><h3>Save your calculation</h3><p>Itemize costs, set overhead, and check your actual margin.</p></div></div><div class="step"><b class="number">2</b><div><h3>Lock the sold plan</h3><p>Preserve the agreed numbers. Save later changes as revisions.</p></div></div><div class="step"><b class="number">3</b><div><h3>Allocate incoming payments</h3><p>Record receipts and see the funded overhead amount.</p></div></div><div class="step"><b class="number">4</b><div><h3>Record your bank transfer</h3><p>Combine jobs into one transfer and keep its reference.</p></div></div></div><div class="section">${btn('Open transfer cen if(view==='jobs'){if(selected){const j=Store.db.jobs.find(j=>j.id===selected);content=j?detail(j):'';if(!j)selected=null}if(!selected)content=top('Jobs & plans',`${Store.db.jobs.length} saved jobs · costs, payments, and allocations`,btn('+ New job','new','','primary'))+`<div class="card"><div class="toolbar"><input id="search" aria-label="Search jobs" placeholder="Search jobs or clients…" value="${esc(filter)}"><select id="statusFilter" aria-label="Filter status">${[['all','All statuses'],['draft','Draft'],['sold','Active'],['complete','Completed']].map(([v,s])=>`<option value="${v}" ${v===statusFilter?'selected':''}>${s}</option>`).join('')}</select></div><div id="jobRows">${filteredJobs()}</div></div>`}

function editTransfer(id){const t=Store.db.transfers.find(t=>t.id===id);showModal('Correct transfer details',`<p class="sub">For amount or job allocation corrections, void this record and record the correct transfer. Neither action moves bank funds.</p><div class="fields">${field('Date','date',t.date,'date','required')}${field('Destination account','account',t.account,'text','required maxlength="200"')}${field('Reference','reference',t.reference,'text','required maxlength="500"')}${field('Reason for correction','reason','','text','required maxlength="500"')}</div>`,'Save correction',f=>{if(f.get('date')>today())throw Error('Transfer date cannot be in the future.');if(!String(f.get('account')).trim()||!String(f.get('reference')).trim()||!String(f.get('reason')).trim())throw Error('Complete all fields.');done(Store.commit(d=>{const x=d.transfers.find(x=>x.id===id);x.date=f.get('date');x.account=String(f.get('account')).trim();x.reference=String(f.get('reference')).trim()},`Corrected transfer ${t.reference} (${t.date}, ${t.account}) to ${f.get('reference')} (${f.get('date')}, ${f.get('account')}) — ${f.get('reason')}`),'Transfer details saved')})}
function settingsPage(){const s=Store.db.settings;return top('Settings & backups','Your business details and defaults for new jobs.')+`<div class="summary-grid"><div class="card"><h2>Business & calculation defaults</h2><form id="settingsForm">${field('Business name','businessName',s.business,'text','required maxlength="200"')}${field('Contact details for printed documents','contact',s.contact,'text','maxlength="1000"')}${field('Dedicated overhead account label','account',s.account,'text','required maxlength="200"')}<div class="fields">${select('Default overhead basis','defaultOH',[['cost','% of job costs'],['sale','% of selling price'],['fixed','Fixed dollar amount']],s.ohBasis)}${field('Default overhead value','defaultOHValue',s.ohBasis==='fixed'?Money.input(s.ohValue):s.ohValue,'number','min="0" max="1000000000" step=".01" required')}${select('Default profit method','defaultProfit',[['margin','Margin on sale'],['markup','Markup on costs + overhead']],s.profitBasis)}${field('Default profit (%)','defaultProfitValue',s.profitValue,'number','min="0" max="1000" step=".01" required')}</div>${select('Default overhead funding','defaultAllocation',[['proportional','Proportional to client payments'],['first','Overhead first']],s.allocation)}<p class="hint">Defaults apply only to new jobs. Existing plans keep their saved settings. Currency: USD.</p><button class="primary">Save settings</button></form></div><div><div class="card"><h2>Backup & restore</h2><p class="sub">Your records stay in this browser. They do not automatically sync to another device or website address.</p><div class="actions">${btn('Export JSON backup','backup','','primary')}${btn('Restore JSON backup','restore')}</div><p class="hint section">Last exported: ${Store.db.lastBackup?esc(new Date(Store.db.lastBackup).toLocaleString()):'Not yet'}</p><p class="hint">Restore replaces this browser’s dataset after validation and confirmation. Export your current records first.</p>${Store.blocked?btn('Export unreadable recovery data','recovery','','danger'):''}</div><div class="card section"><h2>Documents & portability</h2><p class="sub">Print job summaries and transfer receipts, or choose “Save as PDF” in your browser’s print dialog.</p><div class="actions">${btn('Export jobs CSV','csv')}${btn('Download this HTML tool','html')}</div></div><div class="card section"><h2>Calculation notes</h2><p class="sub">Margin = planned profit ÷ sale. Markup = planned profit ÷ (costs + overhead). Selling price remains editable.</p><p class="sub">Overhead allocations use cumulative payments, rounded to cents. The final payment funds the exact remaining overhead target.</p><p class="sub">This is a planning and transfer-record tool. It does not reconcile bank balances, track actual expenses, or calculate tax. All features are rule-based. No AI is connected.</p></div></div></div>`}
function download(name,text,type){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
function backup(){if(Store.blocked){download('job-money-recovery.txt',Store.raw||'No readable data','text/plain');return}const stamp=new Date().toISOString();if(Store.commit(d=>d.lastBackup=stamp,'Exported JSON backup')){download('job-money-backup-'+today()+'.json',JSON.stringify(Store.db,null,2),'application/json');render();toast('Backup download requested. Keep it in a safe location.')}}
function csv(){const rows=[['Job','Client','Status','Sale USD','Costs USD','Overhead target USD','Planned profit USD','Margin percent','Net received USD','Transferred USD','Ready USD','Excess transferred USD']];for(const j of Store.db.jobs){const r=Rules.job(j,Store.db);rows.push([j.name,j.client,j.status,...[j.plan.sale,r.cost,r.oh,r.profit].map(Money.input),r.margin.toFixed(2),...[r.received,r.transferred,r.ready,r.over].map(Money.input)])}const cell=v=>'"'+String(/^[=+\-@\t\r]/.test(String(v))?"'"+v:v).replace(/"/g,'""')+'"';download('job-money-jobs-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function printDoc(j,revision){const p=revision===undefined?j.plan:j.revisions[revision].plan;const r=Rules.plan(p),s=Store.db.settings;const live=Rules.job(j,Store.db);document.getElementById('printArea').innerHTML=`<div class="eyebrow">${esc(s.business)}</div><h1>Job financial plan</h1><p>${esc(s.contact)}</p><hr><h2>${esc(j.name)}</h2><p>${esc(j.client)}<br>${revision===undefined?'Current plan':'Historical revision '+(revision+1)} · Printed ${esc(today())}</p><div class="grid">${[['Sale',p.sale],['Job costs',r.cost],['Overhead',r.oh],['Planned profit',r.profit]].map(([k,v])=>`<div><span>${k}</span><h2>${Money.fmt(v)}</h2></div>`).join('')}</div><p>${esc(basisText(p))} · ${r.margin.toFixed(2)}% planned margin · ${p.allocation==='first'?'Overhead funded first':'Proportional funding'}</p><table><thead><tr><th>Category</th><th>Description</th><th class="num">Cost</th></tr></thead><tbody>${p.costs.map(c=>`<tr><td>${esc(c.category)}</td><td>${esc(c.description)}</td><td class="num">${Money.fmt(c.amount)}</td></tr>`).join('')}</tbody></table>${revision===undefined?`<h2 class="section">Current payment & transfer position</h2><p>Net payments: ${Money.fmt(live.received)} · Transferred: ${Money.fmt(live.transferred)} · Ready: ${Money.fmt(live.ready)}${live.over?' · Excess transferred: '+Money.fmt(live.over):''}</p><table><thead><tr><th>Date</th><th>Payment reference</th><th class="num">Amount</th></tr></thead><tbody>${j.payments.filter(p=>!p.voided).map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.reference)}</td><td class="num">${Money.fmt(p.amount)}</td></tr>`).join('')}</tbody></table>`:''}<p style="white-space:pre-wrap">${esc(j.notes)}</p><p class="sub">Internal planning document. Profit is based on planned costs, not actual expenses. USD.</p>`;window.print()}
function receipt(id){const t=Store.db.transfers.find(x=>x.id===id);document.getElementById('printArea').innerHTML=`<div class="eyebrow">${esc(Store.db.settings.business)}</div><h1>Overhead transfer record</h1><p>${esc(Store.db.settings.contact)}</p><hr><p>Date: ${esc(t.date)}<br>Destination: ${esc(t.account)}<br>Bank reference: ${esc(t.reference)}<br>Status: ${t.voided?'VOIDED':'Recorded completed'}</p><table><thead><tr><th>Job</th><th>Client</th><th class="num">Allocation</th></tr></thead><tbody>${t.lines.map(l=>{const j=Store.db.jobs.find(j=>j.id===l.jobId);return `<tr><td>${esc(j.name)}</td><td>${esc(j.client)}</td><td class="num">${Money.fmt(l.amount)}</td></tr>`}).join('')}</tbody></table><h2 class="section">Total: ${Money.fmt(sum(t.lines,l=>l.amount))}</h2><p>${esc(t.note)}</p><p class="sub">Internal record entered by the user; not bank confirmation. USD.</p>`;window.print()}
async function restoreFile(file){if(!file)return;try{if(file.size>20000000)throw Error('Backup exceeds the 20 MB import limit.');const text=await file.text();const d=Schema.validate(JSON.parse(text));if(!confirm(`Replace the current data with ${d.jobs.length} jobs and ${d.transfers.length} transfers from this backup? Export current data first if needed.`))return;if(localStorage.getItem(Store.key)!==Store.raw&&!Store.blocked)throw Error('Another tab changed this data. Reload before restoring.');d.revision++;d.audit.push({at:new Date().toISOString(),message:'Restored JSON backup'});const raw=JSON.stringify(d);localStorage.setItem(Store.key,raw);Store.raw=raw;Store.db=d;Store.blocked=false;selected=null;render();toast('Backup restored')}catch(e){toast('Restore failed: '+e.message)}finally{document.getElementById('restoreFile').value=''}}
function metadata(id){const j=Store.db.jobs.find(j=>j.id===id);showModal('Edit job details',`${field('Job name','jobName',j.name,'text','required maxlength="200"')}${field('Client','client',j.client,'text','maxlength="200"')}<label for="notes">Notes</label><textarea id="notes" maxlength="10000">${esc(j.notes)}</textarea>`,'Save details',f=>{if(!String(f.get('jobName')).trim())throw Error('Enter a job name.');done(Store.commit(d=>{const x=d.jobs.find(x=>x.id===id);x.name=String(f.get('jobName')).trim();x.client=String(f.get('client')).trim();x.notes=document.getElementById('notes').value},'Edited details for '+j.name),'Job details saved')})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;try{if(a==='nav'){view=id;selected=null;render()}if(a==='new')editPlan();if(a==='edit')editPlan(id);if(a==='open'){selected=id;view='jobs';render()}if(a==='back'){selected=null;render()}if(a==='close')closeModal();if(a==='addCost'){document.getElementById('costRows').insertAdjacentHTML('beforeend',costRow());modalDirty=true;updateLive()}if(a==='removeCost'){b.closest('.costline').remove();modalDirty=true;updateLive()}if(a==='suggest'){document.getElementById('sale').value=Money.input(Rules.suggest(readPlan()));modalDirty=true;updateLive()}if(a==='sell')sell(id);if(a==='payment')payment(id);if(a==='editPayment'){const [j,p]=id.split('|');payment(j,p)}if(a==='voidPayment')voidPayment(id);if(a==='transfer')recordTransfer(id);if(a==='editTransfer')editTransfer(id);if(a==='voidTransfer'){const t=Store.db.transfers.find(x=>x.id===id),reason=prompt('Why are you voiding this transfer record? This does not return money from your bank account.');if(reason?.trim())done(Store.commit(d=>{const x=d.transfers.find(x=>x.id===id);x.voided=true;x.voidReason=reason},'Voided transfer '+t.reference+' — '+reason),'Transfer record voided')}if(a==='print')printDoc(Store.db.jobs.find(j=>j.id===id));if(a==='printRevision'){const [j,r]=id.split('|');printDoc(Store.db.jobs.find(x=>x.id===j),Number(r))}if(a==='receipt')receipt(id);if(a==='backup')backup();if(a==='csv')csv();if(a==='restore')document.getElementById('restoreFile').click();if(a==='recovery')download('job-money-recovery.txt',Store.raw||'','text/plain');if(a==='metadata')metadata(id);if(a==='delete'&&confirm('Delete this draft job permanently?')){if(Store.commit(d=>{d.jobs=d.jobs.filter(j=>j.id!==id)},'Deleted draft job')){selected=null;render()}}if(a==='duplicate'){const j=structuredClone(Store.db.jobs.find(j=>j.id===id));j.id=uid();j.name+=' (copy)';j.status='draft';j.payments=[];j.revisions=[];j.createdAt=new Date().toISOString();if(Store.commit(d=>d.jobs.push(j),'Duplicated as draft: '+j.name)){selected=j.id;view='jobs';render()}}if(a==='complete'||a==='reopen'){const j=Store.db.jobs.find(j=>j.id===id),r=Rules.job(j,Store.db);if(a==='complete'&&(r.balance||r.ready||r.over)&&!confirm('This job has an outstanding balance, ready allocation, or excess transfer. Mark completed anyway? Its money tracking will remain active.'))return;done(Store.commit(d=>d.jobs.find(j=>j.id===id).status=a==='complete'?'complete':'sold',`${a==='complete'?'Completed':'Reopened'} job: ${j.name}`),'Job status saved')}if(a==='html'){const doc=document.documentElement.cloneNode(true);doc.querySelector('#app').innerHTML='';doc.querySelector('#nav').innerHTML='';doc.querySelector('#modal').innerHTML='';doc.querySelector('#modal').removeAttribute('open');doc.querySelector('#printArea').innerHTML='';doc.querySelector('#toast').textContent='';doc.querySelector('#business').textContent='';doc.querySelector('body').removeAttribute('style');doc.querySelector('#saveState').textContent='Saved on this browser';download('index.html','<!doctype html>\n'+doc.outerHTML,'text/html')}}catch(e){toast(e.message)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){filter=e.target.value;document.getElementById('jobRows').innerHTML=filteredJobs()}});document.addEventListener('change',e=>{if(e.target.id==='statusFilter'){statusFilter=e.target.value;document.getElementById('jobRows').innerHTML=filteredJobs()}});
document.addEventListener('submit',e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();const f=new FormData(e.target);try{const s={business:String(f.get('businessName')).trim(),contact:String(f.get('contact')).trim(),account:String(f.get('account')).trim(),ohBasis:f.get('defaultOH'),ohValue:f.get('defaultOH')==='fixed'?Money.cents(f.get('defaultOHValue')):Number(f.get('defaultOHValue')),profitBasis:f.get('defaultProfit'),profitValue:Number(f.get('defaultProfitValue')),allocation:f.get('defaultAllocation')};if(!s.business||!s.account)throw Error('Enter a business name and overhead account label.');if(s.ohBasis!=='fixed'&&s.ohValue>1000)throw Error('Overhead percentage cannot exceed 1000%.');if(Store.commit(d=>d.settings=s,'Updated business settings and new-job defaults')){render();toast('Settings saved')}}catch(e){toast(e.message)}});
document.getElementById('modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});document.getElementById('restoreFile').onchange=e=>restoreFile(e.target.files[0]);document.getElementById('backupTop').onclick=backup;window.addEventListener('beforeunload',e=>{if(modalDirty){e.preventDefault();e.returnValue=''}});window.addEventListener('storage',e=>{if(e.key===Store.key)toast('Data changed in another tab. Reload before editing.')});
Store.load();render();window.JobMoneyPlanner=Object.freeze({version:'1.0.0',calculatePlan:p=>Rules.plan(structuredClone(p)),calculateJob:(j,d)=>Rules.job(structuredClone(j),structuredClone(d)),suggestPrice:p=>Rules.suggest(structuredClone(p)),getSnapshot:()=>structuredClone(Store.db)});
</script></body></html>
