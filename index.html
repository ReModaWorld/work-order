<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a2a">
<title>Work Order Builder</title>
<style>
:root{--navy:#0b1a2a;--purple:#7455ec;--purple2:#6045d2;--bg:#f4f6f8;--ink:#142237;--muted:#748092;--line:#dfe4ea;--good:#18794e;--bad:#b82f2f;--warn:#8a5b00;--shadow:0 4px 16px rgba(16,24,40,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.hide{display:none!important}
.top{min-height:66px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:12px 22px;gap:12px;position:sticky;top:0;z-index:20}.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#9277ff,#5d40d4);display:grid;place-items:center;font-weight:bold}.brand{font-size:18px}.product{font-size:12px;color:rgba(255,255,255,.65)}.projectSelect{margin-left:auto;display:flex;gap:8px;align-items:center}.projectSelect select{max-width:260px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:9px}.projectSelect option{color:#172337}
.layout{display:grid;grid-template-columns:76px 1fr;min-height:calc(100vh - 66px)}.nav{background:#fff;border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:8px;position:sticky;top:66px;height:calc(100vh - 66px)}.nav button{width:54px;min-height:45px;border:0;border-radius:10px;background:transparent;color:#7c8795;font-size:10px;font-weight:bold}.nav button:hover{background:#f3f4f6}.nav button.on{background:#eeeaff;color:#5d40d4}.nav .bottom{margin-top:auto}
.main{min-width:0}.title{background:#fff;border-bottom:1px solid var(--line);padding:20px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{color:var(--purple);font-size:10px;font-weight:bold;letter-spacing:1.3px}.title h1{font-size:27px;margin:5px 0}.title p{color:var(--muted);font-size:12px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.content{max-width:1400px;margin:auto;padding:24px}.btn{border:0;border-radius:9px;padding:10px 14px;font-size:12px;font-weight:bold;background:#fff;color:#405065;border:1px solid #d7dde5}.btn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}.btn.primary:hover{background:var(--purple2)}.btn.soft{background:#eeeaff;color:#5d40d4;border-color:#eeeaff}.btn.danger{background:#fff0f0;color:var(--bad);border-color:#f5d2d2}.btn.full{width:100%;margin-top:12px}.btn.small{padding:7px 9px;font-size:11px}
.steps{display:flex;justify-content:center;align-items:center;gap:9px;margin-bottom:20px}.step{border:0;background:transparent;color:#8993a0;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:bold}.step i{font-style:normal;width:28px;height:28px;border:1px solid #d7dde5;border-radius:50%;background:#fff;display:grid;place-items:center}.step.on{color:#5538c5}.step.on i{background:var(--purple);color:#fff;border-color:var(--purple)}
.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px}.grid.assign{grid-template-columns:1.15fr .85fr}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.panelHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.panelHead h2{font-size:16px;margin:0 0 4px}.panelHead p{font-size:11px;color:var(--muted);margin:0}.scope{width:100%;min-height:380px;border:1px solid #d9dfe6;border-radius:9px;padding:13px;resize:vertical;outline:0;font-size:13px;line-height:1.6}.scope:focus,input:focus,textarea:focus,select:focus{border-color:#8b73ed;box-shadow:0 0 0 3px rgba(116,85,236,.1);outline:0}
.list{display:flex;flex-direction:column;gap:8px;max-height:600px;overflow:auto}.row{display:flex;gap:9px;align-items:flex-start;border:1px solid #e2e7ec;border-radius:10px;padding:11px}.rowBody{flex:1;min-width:0}.row b{font-size:12px}.row p{font-size:11px;line-height:1.5;color:#697586;margin:5px 0}.tag{display:inline-block;font-size:9px;text-transform:uppercase;background:#eeeaff;color:#6045d2;padding:4px 6px;border-radius:5px;font-weight:bold;margin-right:6px}.row select{width:100%;padding:8px;border:1px solid #d9dfe6;border-radius:7px;background:#fafafa;font-size:11px}.icon{border:0;background:transparent;color:#798594;padding:6px;border-radius:7px}.icon:hover{background:#f0f2f4}.empty{min-height:210px;display:flex;align-items:center;justify-content:center;text-align:center;color:#8b96a5;font-size:12px;line-height:1.6}.avatar{width:38px;height:38px;border-radius:10px;background:#eeeaff;color:#6045d2;display:grid;place-items:center;font-weight:bold;font-size:11px;flex:0 0 auto}.provider{align-items:center}.count{font-size:9px;background:#f1f3f5;padding:5px 7px;border-radius:6px;color:#7c8795}.count.on{background:#e9f7ef;color:var(--good)}
.toolbar{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.toolbar input{border:0;outline:0;width:230px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow)}.status{display:inline-block;font-size:9px;background:#fff3d6;color:var(--warn);padding:5px 8px;border-radius:20px;font-weight:bold}.status.done{background:#e9f7ef;color:var(--good)}.card h3{margin:18px 0 5px}.card p{font-size:11px;color:#697586}.meta{display:flex;gap:18px;font-size:10px;color:#697586;margin:14px 0}.cardActions{display:flex;gap:5px;border-top:1px solid #edf0f2;padding-top:10px}.cardActions .btn:first-child{flex:1}
.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;text-transform:uppercase;letter-spacing:.5px;font-size:9px;color:#8993a1;padding:10px;border-bottom:1px solid #e5e9ed}td{padding:12px 10px;border-bottom:1px solid #edf0f2}td small{display:block;color:#98a2b3;margin-top:4px}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(11,26,42,.78);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(18px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom))}.modal{width:min(680px,100%);margin:0 auto;background:#fff;border-radius:15px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalHead h2{margin:0;font-size:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.wide{grid-column:1/-1}.field span{font-size:10px;color:#667085;font-weight:bold}.field input,.field textarea,.field select{width:100%;border:1px solid #d7dde5;border-radius:8px;padding:10px;background:#fff}.field textarea{min-height:85px;resize:vertical}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.preview{position:fixed;inset:0;z-index:45;background:#e9ebee;overflow:auto}.previewBar{position:sticky;top:0;background:#fff;border-bottom:1px solid #dfe3e8;padding:10px 16px;display:flex;align-items:center;gap:8px;z-index:2}.previewBar .space{flex:1}.paper{width:8.5in;min-height:11in;margin:24px auto;background:#fff;padding:.55in;box-shadow:0 7px 30px rgba(16,24,40,.17)}.woHead{display:flex;justify-content:space-between;border-bottom:3px solid #111d2b;padding-bottom:20px}.docBrand{font-size:25px;font-weight:bold}.woTitle{text-align:right}.woTitle h1{margin:0}.docGrid{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin:24px 0}.label{font-size:9px;letter-spacing:1.2px;color:#7b8492;font-weight:bold;text-transform:uppercase;margin-bottom:6px}.info{font-size:12px;line-height:1.7}.docSection{margin-top:22px;font-size:12px}.docSection h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #ccd1d8;padding-bottom:7px}.docTask{display:grid;grid-template-columns:28px 1fr 90px;gap:9px;border-bottom:1px solid #e5e7eb;padding:12px 0}.num{width:24px;height:24px;border-radius:50%;background:#111d2b;color:#fff;display:grid;place-items:center;font-size:10px}.docTask p{font-size:11px;color:#596273;line-height:1.5}.amount{text-align:right;font-weight:bold}.total{display:flex;justify-content:flex-end;gap:32px;margin-top:16px;font-weight:bold}.terms{font-size:10px;line-height:1.6;background:#f4f5f7;padding:13px}.sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:50px}.sig{border-top:1px solid #333;padding-top:7px;color:#667085;font-size:10px}.toast{position:fixed;right:16px;top:80px;z-index:100;background:#142237;color:#fff;padding:11px 14px;border-radius:9px;font-size:12px}.toast.bad{background:#a92929}.notice{background:#fff8e8;border:1px solid #f0dfb6;color:#72530f;padding:12px;border-radius:9px;font-size:11px;line-height:1.5;margin-top:15px}
@media(max-width:920px){.grid,.grid.assign{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}@media(max-width:650px){.top{padding:10px 12px}.brand{font-size:15px}.product{display:none}.projectSelect select{max-width:135px}.layout{grid-template-columns:1fr}.nav{position:fixed;left:0;right:0;bottom:0;top:auto;height:64px;border:0;border-top:1px solid var(--line);z-index:30;flex-direction:row;justify-content:space-around;padding:6px}.nav .bottom{margin:0}.main{padding-bottom:65px}.title{padding:17px;align-items:flex-start;flex-direction:column}.content{padding:14px}.steps{justify-content:flex-start}.step strong{display:none}.cards{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.wide{grid-column:auto}.paper{width:100%;margin:0;padding:20px}.docGrid{grid-template-columns:1fr}.docTask{grid-template-columns:26px 1fr}.amount{grid-column:2;text-align:left}.previewBar{flex-wrap:wrap}.modal{padding:16px}.toolbar input{width:150px}}
</style>
</head>
<body>
<div id="app"><div class="empty" style="min-height:100vh"><b>Loading Work Order Builder…</b></div></div>
<input id="restoreFile" class="hide" type="file" accept=".json,application/json">
<noscript><div style="padding:30px;font-family:Arial">JavaScript must be enabled to use the Work Order Builder.</div></noscript>
<script>
(function(){
'use strict';
var BUILD='WO-2026-08-30-ES5';
var KEY='work-order-builder-github-v1';
var state=readData();
var screen='builder';
var step=1;
var modalType='';
var modalId='';
var previewId='';

function id(){return 'x'+Math.random().toString(36).substring(2,10)}
function text(v){return String(v===null||typeof v==='undefined'?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}
function find(list,value){var i;for(i=0;i<list.length;i++){if(list[i].id===value)return list[i]}return null}
function indexOfId(list,value){var i;for(i=0;i<list.length;i++){if(list[i].id===value)return i}return-1}
function today(){var d=new Date(),m=String(d.getMonth()+1),day=String(d.getDate());if(m.length<2)m='0'+m;if(day.length<2)day='0'+day;return d.getFullYear()+'-'+m+'-'+day}
function dollars(v){return Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function fresh(){var p={id:id(),name:'Living Room Fireplace Feature',number:'PRJ-2026-0148',client:'Jordan & Taylor Morgan',address:'4821 Willow Bend Drive, Plano, TX 75093',contact:'Jordan Morgan',phone:'(469) 555-0194',start:'2026-09-08',end:'2026-09-12',access:'Use front entrance. Protect flooring from entry to work area. Coordinate arrival with the project manager.',scope:'Prepare and protect the living room work area. Build an approximately 7 ft wide frame, approximately 6 inches deep or as required for the homeowner-provided electric fireplace. Install the electric fireplace and connect it to the nearest available power source. Install warm-white remote-controlled LED lighting vertically on both sides. Install selected wall panels from the top of the baseboard to the ceiling. Cut and finish a recessed opening so the television sits flush with the panels. Complete finish details, remove debris, and leave the area clean.',tasks:[],orders:[]};return{company:{name:'Your Company',phone:'',email:'',address:''},providers:[{id:'p1',name:'Northstar Carpentry',trade:'Framing',contact:'Marco Diaz',phone:'(214) 555-0137',email:'marco@northstar.example'},{id:'p2',name:'BrightLine Electric',trade:'Electrical',contact:'Andre Lewis',phone:'(972) 555-0188',email:'andre@brightline.example'},{id:'p3',name:'Precision Panel Works',trade:'Wall Panels',contact:'Eli Turner',phone:'(469) 555-0171',email:'eli@precisionpanel.example'}],projects:[p],active:p.id}}
function readData(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.projects&&d.projects.length&&d.providers&&d.company)return d}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('Browser storage is unavailable. Download a backup before closing.',true)}}
function project(){return find(state.projects,state.active)||state.projects[0]}
function notify(message,bad){var old=document.getElementById('toast');if(old&&old.parentNode)old.parentNode.removeChild(old);var box=document.createElement('div');box.id='toast';box.className='toast'+(bad?' bad':'');box.appendChild(document.createTextNode(message));document.body.appendChild(box);setTimeout(function(){if(box.parentNode)box.parentNode.removeChild(box)},2600)}
function parseScope(value){var parts=value.replace(/\r/g,'').split(/(?:[.!?]+\s+|\n+)/),out=[],i,s,q,trade,title;for(i=0;i<parts.length;i++){s=parts[i].replace(/^\s+|\s+$/g,'');if(s.length<4)continue;q=s.toLowerCase();trade='General';if(/electric|power|led|light|outlet|switch/.test(q))trade='Electrical';else if(/frame|build|blocking/.test(q))trade='Framing';else if(/panel|slat|laminate|tile/.test(q))trade='Wall Panels';else if(/finish|paint|drywall|clean|debris/.test(q))trade='Finishing';title=s.split(/,| and | so /)[0];out.push({id:id(),title:title,trade:trade,area:'',details:s,materials:'Confirm with project manager',provider:'',cost:0})}return out}
function header(){var p=project(),c=state.company,options='',i;for(i=0;i<state.projects.length;i++)options+='<option value="'+text(state.projects[i].id)+'"'+(state.projects[i].id===p.id?' selected':'')+'>'+text(state.projects[i].name||'Untitled Project')+'</option>';return'<header class="top"><div class="mark">'+text((c.name||'C').charAt(0).toUpperCase())+'</div><b class="brand">'+text(c.name||'Your Company')+'</b><span class="product">Work Orders</span><div class="projectSelect"><select data-change="project">'+options+'</select><button class="btn soft small" data-action="newProject">+ New</button></div></header>'}
function navigation(){return'<nav class="nav"><button class="'+(screen==='builder'?'on':'')+'" data-screen="builder">BUILD</button><button class="'+(screen==='orders'?'on':'')+'" data-screen="orders">ORDERS</button><button class="'+(screen==='providers'?'on':'')+'" data-screen="providers">PROVIDERS</button><button class="bottom '+(screen==='settings'?'on':'')+'" data-screen="settings">SETTINGS</button></nav>'}
function titleBar(titleValue,sub,buttons){return'<div class="title"><div><span class="eyebrow">PROJECT OPERATIONS</span><h1>'+text(titleValue)+'</h1><p>'+text(sub)+'</p></div><div class="actions">'+buttons+'</div></div>'}
function taskRows(assign){var p=project(),html='',i,t,opts,j,pr;if(!p.tasks.length)return'<div class="empty">No tasks yet.<br>Convert the scope or add a task manually.</div>';for(i=0;i<p.tasks.length;i++){t=p.tasks[i];opts='';if(assign){opts='<select data-assign="'+text(t.id)+'"><option value="">Choose provider…</option>';for(j=0;j<state.providers.length;j++){pr=state.providers[j];opts+='<option value="'+text(pr.id)+'"'+(t.provider===pr.id?' selected':'')+'>'+text(pr.name)+' — '+text(pr.trade)+'</option>'}opts+='</select>'}html+='<div class="row"><div class="rowBody"><div><span class="tag">'+text(t.trade)+'</span><b>'+text(t.title)+'</b></div><p>'+text(t.details)+'</p>'+opts+'</div><button class="icon" data-action="editTask" data-id="'+text(t.id)+'">Edit</button><button class="icon" data-action="deleteTask" data-id="'+text(t.id)+'">Delete</button></div>'}return html}
function taskPanel(assign){var p=project(),un=0,i;for(i=0;i<p.tasks.length;i++)if(!p.tasks[i].provider)un++;return'<section class="panel"><div class="panelHead"><div><h2>'+(assign?'Assign every task':'Task pool')+'</h2><p>'+p.tasks.length+' editable tasks · '+un+' unassigned</p></div><button class="btn small" data-action="addTask">+ Add task</button></div><div class="list">'+taskRows(assign)+'</div>'+(p.tasks.length?'<button class="btn primary full" data-next="'+(assign?'3':'2')+'">'+(assign?'Review assignments':'Continue to assignments')+'</button>':'')+'</section>'}
function providersPool(){var p=project(),html='',i,j,pr,n;for(i=0;i<state.providers.length;i++){pr=state.providers[i];n=0;for(j=0;j<p.tasks.length;j++)if(p.tasks[j].provider===pr.id)n++;html+='<div class="row provider"><div class="avatar">'+text(initials(pr.name))+'</div><div class="rowBody"><b>'+text(pr.name)+'</b><p>'+text(pr.trade)+' · '+text(pr.contact)+'</p></div><span class="count '+(n?'on':'')+'">'+n+' task'+(n===1?'':'s')+'</span></div>'}return'<section class="panel"><div class="panelHead"><div><h2>Provider pool</h2><p>Available companies and current matches.</p></div><button class="btn small" data-action="addProvider">+ Add</button></div><div class="list">'+(html||'<div class="empty">No providers yet.</div>')+'</div></section>'}
function initials(name){var a=String(name||'').split(' '),s='',i;for(i=0;i<a.length&&i<2;i++)if(a[i])s+=a[i].charAt(0);return s.toUpperCase()}
function builder(){var p=project(),body='',groups,i,j,pid,provider,tasks,total;if(step===1)body='<div class="grid"><section class="panel"><div class="panelHead"><div><h2>Approved scope</h2><p>Paste or edit the scope the builder should read.</p></div></div><textarea class="scope" id="scopeText">'+text(p.scope)+'</textarea><button class="btn primary full" data-action="extract">Convert scope to tasks</button></section>'+taskPanel(false)+'</div>';else if(step===2)body='<div class="grid assign">'+taskPanel(true)+providersPool()+'</div>';else{groups=[];for(i=0;i<p.tasks.length;i++)if(p.tasks[i].provider&&groups.indexOf(p.tasks[i].provider)<0)groups.push(p.tasks[i].provider);body='<section class="panel"><div class="panelHead"><div><h2>Review work order package</h2><p>One work order will be created for each assigned provider.</p></div></div>';if(!groups.length)body+='<div class="empty">No assigned work. Return to step 2 and match tasks with providers.</div>';for(i=0;i<groups.length;i++){pid=groups[i];provider=find(state.providers,pid);tasks=0;total=0;for(j=0;j<p.tasks.length;j++)if(p.tasks[j].provider===pid){tasks++;total+=Number(p.tasks[j].cost||0)}body+='<div class="row provider"><div class="avatar">WO</div><div class="rowBody"><b>'+text(provider?provider.name:'Provider')+'</b><p>'+tasks+' assigned tasks</p></div><b>$'+dollars(total)+'</b></div>'}body+='<button class="btn primary full" data-action="generate">Generate '+groups.length+' work order'+(groups.length===1?'':'s')+'</button></section>'}return titleBar('Work Order Builder',p.name+' · '+p.number,'<button class="btn" data-action="editProject">Project details</button><button class="btn primary" data-action="generate">Generate work orders</button>')+'<div class="content"><div class="steps"><button class="step '+(step===1?'on':'')+'" data-step="1"><i>1</i><strong>Scope & tasks</strong></button><span>›</span><button class="step '+(step===2?'on':'')+'" data-step="2"><i>2</i><strong>Assign providers</strong></button><span>›</span><button class="step '+(step===3?'on':'')+'" data-step="3"><i>3</i><strong>Review & generate</strong></button></div>'+body+'</div>'}
function orders(){var p=project(),html='',i,o,pr,total,j,t;for(i=0;i<p.orders.length;i++){o=p.orders[i];pr=find(state.providers,o.provider);total=0;for(j=0;j<o.tasks.length;j++){t=find(p.tasks,o.tasks[j]);if(t)total+=Number(t.cost||0)}html+='<article class="card"><span class="status '+(o.status==='Completed'?'done':'')+'">'+text(o.status)+'</span><h3>'+text(o.number)+'</h3><p>'+text(pr?pr.name:'Provider unavailable')+'</p><div class="meta"><span>'+o.tasks.length+' tasks</span><span>$'+dollars(total)+'</span></div><div class="cardActions"><button class="btn small" data-action="openOrder" data-id="'+text(o.id)+'">Open</button><button class="btn small" data-action="printOrder" data-id="'+text(o.id)+'">Print/PDF</button><button class="btn small" data-action="shareOrder" data-id="'+text(o.id)+'">Share</button><button class="btn small danger" data-action="deleteOrder" data-id="'+text(o.id)+'">Delete</button></div></article>'}return titleBar('Work orders',p.name+' · '+p.number,'<button class="btn primary" data-screen="builder">+ Build work order</button>')+'<div class="content"><div class="toolbar"><b>Generated work orders</b><span>'+p.orders.length+' total</span></div><div class="cards">'+(html||'<div class="panel empty">No work orders yet. Build tasks, assign providers, and generate the package.</div>')+'</div></div>'}
function providerPage(){var html='',i,p,used,j,k;for(i=0;i<state.providers.length;i++){p=state.providers[i];used=0;for(j=0;j<state.projects.length;j++)for(k=0;k<state.projects[j].tasks.length;k++)if(state.projects[j].tasks[k].provider===p.id)used++;html+='<tr><td><b>'+text(p.name)+'</b></td><td><span class="tag">'+text(p.trade)+'</span></td><td>'+text(p.contact)+'<small>'+text(p.email)+'</small></td><td>'+text(p.phone)+'</td><td>'+used+'</td><td><button class="btn small" data-action="editProvider" data-id="'+text(p.id)+'">Edit</button> <button class="btn small danger" data-action="deleteProvider" data-id="'+text(p.id)+'">Delete</button></td></tr>'}return titleBar('Providers','Companies available across all projects.','<button class="btn primary" data-action="addProvider">+ Add provider</button>')+'<div class="content"><div class="panel tableWrap"><table><thead><tr><th>Provider</th><th>Trade</th><th>Contact</th><th>Phone</th><th>Assigned</th><th></th></tr></thead><tbody>'+html+'</tbody></table></div></div>'}
function settings(){var c=state.company;return titleBar('Company and data settings','Customize the business identity and protect project records.','<button class="btn" data-action="editCompany">Edit company</button>')+'<div class="content"><div class="grid"><section class="panel"><h2>'+text(c.name||'Your Company')+'</h2><p>'+text(c.address)+'</p><p>'+text(c.phone)+(c.phone&&c.email?' · ':'')+text(c.email)+'</p><button class="btn" data-action="editCompany">Edit company details</button></section><section class="panel"><h2>Backup and restore</h2><p style="font-size:12px;color:#748092;line-height:1.6">Download all projects, providers, assignments and work orders. Restore the same file on another browser.</p><button class="btn primary" data-action="backup">Download backup</button> <button class="btn" data-action="restore">Restore backup</button></section></div><div class="notice"><b>Important:</b> This standalone edition stores records in this browser. Download regular backups. Build '+BUILD+'.</div></div>'}
function render(){var main=screen==='builder'?builder():screen==='orders'?orders():screen==='providers'?providerPage():settings();document.getElementById('app').innerHTML=header()+'<div class="layout">'+navigation()+'<main class="main">'+main+'</main></div>'+modalHtml()+previewHtml();document.title='Work Order Builder — '+BUILD}
function field(label,name,value,wide,type){return'<label class="field '+(wide?'wide':'')+'"><span>'+label+'</span><input name="'+name+'" type="'+(type||'text')+'" value="'+text(value)+'"></label>'}
function area(label,name,value){return'<label class="field wide"><span>'+label+'</span><textarea name="'+name+'">'+text(value)+'</textarea></label>'}
function modalWrap(titleValue,body,saveAction){return'<div class="overlay" id="modalOverlay"><div class="modal"><div class="modalHead"><h2>'+text(titleValue)+'</h2><button class="icon" data-action="closeModal">Close</button></div><form id="editForm">'+body+'<div class="modalActions"><button type="button" class="btn" data-action="closeModal">Cancel</button><button type="submit" class="btn primary" data-save="'+saveAction+'">Save</button></div></form></div></div>'}
function modalHtml(){var p=project(),x,body='',i;if(!modalType)return'';if(modalType==='task'){x=find(p.tasks,modalId)||{id:modalId,title:'',trade:'General',area:'',details:'',materials:'',provider:'',cost:0};body='<div class="form">'+field('Task title','title',x.title,true)+field('Trade','trade',x.trade,false)+field('Area / room','area',x.area,false)+area('Instructions','details',x.details)+area('Materials / responsibility','materials',x.materials)+'<label class="field"><span>Provider</span><select name="provider"><option value="">Unassigned</option>';for(i=0;i<state.providers.length;i++)body+='<option value="'+text(state.providers[i].id)+'"'+(x.provider===state.providers[i].id?' selected':'')+'>'+text(state.providers[i].name)+'</option>';body+='</select></label>'+field('Provider amount','cost',x.cost,false,'number')+'</div>';return modalWrap(x.title?'Edit task':'Add task',body,'task')}
if(modalType==='provider'){x=find(state.providers,modalId)||{id:modalId,name:'',trade:'',contact:'',phone:'',email:''};body='<div class="form">'+field('Company name','name',x.name,true)+field('Trade','trade',x.trade,false)+field('Contact','contact',x.contact,false)+field('Phone','phone',x.phone,false)+field('Email','email',x.email,false)+'</div>';return modalWrap(x.name?'Edit provider':'Add provider',body,'provider')}
if(modalType==='project'){x=modalId==='new'?{id:id(),name:'',number:'',client:'',address:'',contact:'',phone:'',start:'',end:'',access:'',scope:'',tasks:[],orders:[]}:p;body='<input type="hidden" name="id" value="'+text(x.id)+'"><div class="form">'+field('Project name','name',x.name,true)+field('Project number','number',x.number,false)+field('Client','client',x.client,false)+field('Site contact','contact',x.contact,false)+field('Phone','phone',x.phone,false)+field('Address','address',x.address,true)+field('Start date','start',x.start,false,'date')+field('Completion date','end',x.end,false,'date')+area('Access and site instructions','access',x.access)+'</div>';return modalWrap(modalId==='new'?'New project':'Project and site details',body,'project')}
if(modalType==='company'){x=state.company;body='<div class="form">'+field('Company name','name',x.name,true)+field('Phone','phone',x.phone,false)+field('Email','email',x.email,false)+field('Address','address',x.address,true)+'</div>';return modalWrap('Company details',body,'company')}
if(modalType==='order'){x=find(p.orders,modalId);body='<div class="form">'+field('Work order number','number',x.number,false)+'<label class="field"><span>Status</span><select name="status">';var statuses=['Draft','Sent','Accepted','Scheduled','In Progress','Submitted for Review','Completed','Cancelled'];for(i=0;i<statuses.length;i++)body+='<option'+(x.status===statuses[i]?' selected':'')+'>'+statuses[i]+'</option>';body+='</select></label>'+area('Provider notes','notes',x.notes)+area('Work order conditions','terms',x.terms)+'</div>';return modalWrap('Edit work order',body,'order')}return''}
function formValues(form){var out={},els=form.elements,i;for(i=0;i<els.length;i++)if(els[i].name)out[els[i].name]=els[i].value;return out}
function documentHtml(p,o,pr,tasks){var c=state.company,total=0,html='',i,t;for(i=0;i<tasks.length;i++){t=tasks[i];total+=Number(t.cost||0);html+='<div class="docTask"><span class="num">'+(i+1)+'</span><div><b>'+text(t.title)+'</b><p>'+text(t.details)+'</p><p><strong>Area:</strong> '+text(t.area||'As shown')+' · <strong>Materials:</strong> '+text(t.materials)+'</p></div><div class="amount">'+(t.cost?'$'+dollars(t.cost):'')+'</div></div>'}return'<div class="woHead"><div><div class="docBrand">'+text(c.name||'Your Company')+'</div><p>'+text(c.address)+'</p><p>'+text(c.phone)+(c.phone&&c.email?' · ':'')+text(c.email)+'</p></div><div class="woTitle"><h1>WORK ORDER</h1><p>'+text(o.number)+'</p><p>Issued '+text(o.date)+'</p></div></div><div class="docGrid"><div><div class="label">Project</div><div class="info"><b>'+text(p.name)+'</b><br>'+text(p.number)+'<br>'+text(p.address)+'</div></div><div><div class="label">Assigned provider</div><div class="info"><b>'+text(pr?pr.name:'')+'</b><br>'+text(pr?pr.contact:'')+' · '+text(pr?pr.trade:'')+'<br>'+text(pr?pr.phone:'')+' · '+text(pr?pr.email:'')+'</div></div><div><div class="label">Client / site contact</div><div class="info"><b>'+text(p.client)+'</b><br>'+text(p.contact)+'<br>'+text(p.phone)+'</div></div><div><div class="label">Schedule</div><div class="info"><b>'+text(p.start)+' — '+text(p.end)+'</b><br>Status: '+text(o.status)+'</div></div></div><div class="docSection"><h2>Site access and preparation</h2><p>'+text(p.access)+'</p></div><div class="docSection"><h2>Assigned scope of work</h2>'+html+'<div class="total"><span>Provider total</span><span>$'+dollars(total)+'</span></div></div><div class="docSection"><h2>Provider notes</h2><p>'+text(o.notes)+'</p></div><div class="docSection"><h2>Work order conditions</h2><div class="terms">'+text(o.terms)+'</div></div><div class="sign"><div class="sig">Authorized by / Date</div><div class="sig">Provider acceptance / Date</div></div>'}
function orderParts(value){var p=project(),o=find(p.orders,value),pr,tasks=[],i,t;if(!o)return null;pr=find(state.providers,o.provider);for(i=0;i<o.tasks.length;i++){t=find(p.tasks,o.tasks[i]);if(t)tasks.push(t)}return{p:p,o:o,pr:pr,tasks:tasks}}
function previewHtml(){var z;if(!previewId)return'';z=orderParts(previewId);if(!z)return'';return'<div class="preview"><div class="previewBar"><button class="btn" data-action="closePreview">Back</button><b>'+text(z.o.number)+'</b><span class="space"></span><button class="btn" data-action="editOrder" data-id="'+text(z.o.id)+'">Edit</button><button class="btn" data-action="shareOrder" data-id="'+text(z.o.id)+'">Share</button><button class="btn primary" data-action="printOrder" data-id="'+text(z.o.id)+'">Print / Export PDF</button></div><div class="paper">'+documentHtml(z.p,z.o,z.pr,z.tasks)+'</div></div>'}
function generate(){var p=project(),providers=[],i,j,pid,old,next=[],num=1,taskIds,o;for(i=0;i<p.tasks.length;i++)if(p.tasks[i].provider&&providers.indexOf(p.tasks[i].provider)<0)providers.push(p.tasks[i].provider);if(!providers.length){notify('Assign at least one task first.',true);return}for(i=0;i<providers.length;i++){pid=providers[i];taskIds=[];for(j=0;j<p.tasks.length;j++)if(p.tasks[j].provider===pid)taskIds.push(p.tasks[j].id);old=null;for(j=0;j<p.orders.length;j++)if(p.orders[j].provider===pid)old=p.orders[j];if(old){old.tasks=taskIds;next.push(old)}else{o={id:id(),number:'WO-'+new Date().getFullYear()+'-'+String(1000+num).substring(1),provider:pid,tasks:taskIds,status:'Draft',date:today(),notes:'Coordinate arrival with the project manager before beginning work.',terms:'Do not perform additional work without written approval. Protect existing finishes, maintain a clean work area, report concealed conditions immediately, and provide completion photos before final payment.'};next.push(o);num++}}p.orders=next;save();screen='orders';step=1;render();notify(next.length+' work order'+(next.length===1?'':'s')+' generated.')}
function printOrder(value){var z=orderParts(value),w,css;if(!z)return;w=window.open('','_blank');if(!w){notify('Allow pop-ups to print or export PDF.',true);return}css=document.getElementsByTagName('style')[0].innerHTML;w.document.open();w.document.write('<!doctype html><html><head><title>'+text(z.o.number)+'</title><style>'+css+'body{background:#fff}.paper{box-shadow:none;margin:0 auto}@media print{.paper{margin:0;width:100%;box-shadow:none}}</style></head><body><div class="paper">'+documentHtml(z.p,z.o,z.pr,z.tasks)+'</div></body></html>');w.document.close();setTimeout(function(){w.focus();w.print()},300)}
function shareOrder(value){var z=orderParts(value),message;if(!z)return;message=z.o.number+' — '+z.p.name+'\nProvider: '+(z.pr?z.pr.name:'')+'\n'+z.tasks.length+' assigned tasks\n'+z.p.address;if(navigator.share){navigator.share({title:z.o.number,text:message})['catch'](function(){})}else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(message).then(function(){notify('Work order summary copied.')})}else{window.prompt('Copy this work order summary:',message)}}
function up(el,attribute){while(el&&el!==document){if(el.getAttribute&&el.getAttribute(attribute)!==null)return el;el=el.parentNode}return null}
document.addEventListener('click',function(e){var el=up(e.target,'data-action'),nav=up(e.target,'data-screen'),st=up(e.target,'data-step'),nx=up(e.target,'data-next'),a,value,p,i,pid;if(nav){screen=nav.getAttribute('data-screen');previewId='';render();return}if(st){step=Number(st.getAttribute('data-step'));render();return}if(nx){step=Number(nx.getAttribute('data-next'));render();return}if(!el)return;a=el.getAttribute('data-action');value=el.getAttribute('data-id')||'';p=project();if(a==='extract'){var scope=document.getElementById('scopeText').value;if(!scope.replace(/^\s+|\s+$/g,'')){notify('Add a scope of work first.',true);return}if(p.tasks.length&&!window.confirm('Replace the current task pool?'))return;p.scope=scope;p.tasks=parseScope(scope);p.orders=[];save();render();notify('Scope converted into editable tasks.')}else if(a==='addTask'){modalType='task';modalId=id();render()}else if(a==='editTask'){modalType='task';modalId=value;render()}else if(a==='deleteTask'){if(window.confirm('Delete this task?')){i=indexOfId(p.tasks,value);if(i>-1)p.tasks.splice(i,1);save();render()}}else if(a==='addProvider'){modalType='provider';modalId=id();render()}else if(a==='editProvider'){modalType='provider';modalId=value;render()}else if(a==='deleteProvider'){if(window.confirm('Delete this provider? Assigned tasks will become unassigned.')){i=indexOfId(state.providers,value);if(i>-1)state.providers.splice(i,1);for(i=0;i<state.projects.length;i++){var j;for(j=0;j<state.projects[i].tasks.length;j++)if(state.projects[i].tasks[j].provider===value)state.projects[i].tasks[j].provider=''}save();render()}}else if(a==='editProject'){modalType='project';modalId=p.id;render()}else if(a==='newProject'){modalType='project';modalId='new';render()}else if(a==='editCompany'){modalType='company';modalId='company';render()}else if(a==='closeModal'){modalType='';modalId='';render()}else if(a==='generate')generate();else if(a==='openOrder'){previewId=value;render()}else if(a==='closePreview'){previewId='';render()}else if(a==='editOrder'){previewId='';modalType='order';modalId=value;render()}else if(a==='printOrder')printOrder(value);else if(a==='shareOrder')shareOrder(value);else if(a==='deleteOrder'){if(window.confirm('Delete this work order?')){i=indexOfId(p.orders,value);if(i>-1)p.orders.splice(i,1);save();render()}}else if(a==='backup'){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='work-order-backup-'+today()+'.json';document.body.appendChild(link);link.click();document.body.removeChild(link);setTimeout(function(){URL.revokeObjectURL(url)},500)}else if(a==='restore'){document.getElementById('restoreFile').click()} });
document.addEventListener('change',function(e){var el=e.target,p=project(),t;if(el.getAttribute('data-change')==='project'){state.active=el.value;save();previewId='';render()}else if(el.getAttribute('data-assign')){t=find(p.tasks,el.getAttribute('data-assign'));if(t){t.provider=el.value;save();render()}}});
document.addEventListener('input',function(e){if(e.target.id==='scopeText'){project().scope=e.target.value;save()}});
document.addEventListener('submit',function(e){var saveType=e.submitter?e.submitter.getAttribute('data-save'):up(e.target,'data-save'),v,p=project(),x,i;e.preventDefault();saveType=saveType||e.target.querySelector('[data-save]').getAttribute('data-save');v=formValues(e.target);if(saveType==='task'){if(!v.title.replace(/^\s+|\s+$/g,'')){notify('Task title is required.',true);return}x={id:modalId,title:v.title,trade:v.trade,area:v.area,details:v.details,materials:v.materials,provider:v.provider,cost:Number(v.cost||0)};i=indexOfId(p.tasks,modalId);if(i>-1)p.tasks[i]=x;else p.tasks.push(x)}else if(saveType==='provider'){if(!v.name.replace(/^\s+|\s+$/g,'')||!v.trade.replace(/^\s+|\s+$/g,'')){notify('Company and trade are required.',true);return}x={id:modalId,name:v.name,trade:v.trade,contact:v.contact,phone:v.phone,email:v.email};i=indexOfId(state.providers,modalId);if(i>-1)state.providers[i]=x;else state.providers.push(x)}else if(saveType==='project'){if(!v.name.replace(/^\s+|\s+$/g,'')){notify('Project name is required.',true);return}if(modalId==='new'){x={id:v.id,name:v.name,number:v.number,client:v.client,address:v.address,contact:v.contact,phone:v.phone,start:v.start,end:v.end,access:v.access,scope:'',tasks:[],orders:[]};state.projects.push(x);state.active=x.id}else{p.name=v.name;p.number=v.number;p.client=v.client;p.address=v.address;p.contact=v.contact;p.phone=v.phone;p.start=v.start;p.end=v.end;p.access=v.access}}else if(saveType==='company'){state.company={name:v.name,phone:v.phone,email:v.email,address:v.address}}else if(saveType==='order'){x=find(p.orders,modalId);x.number=v.number;x.status=v.status;x.notes=v.notes;x.terms=v.terms}modalType='';modalId='';save();render();notify('Saved successfully.')});
document.getElementById('restoreFile').addEventListener('change',function(e){var file=e.target.files[0],reader;if(!file)return;reader=new FileReader();reader.onload=function(){try{var d=JSON.parse(reader.result);if(!d.projects||!d.providers||!d.company)throw new Error('Invalid backup');if(window.confirm('Replace current browser data with this backup?')){state=d;save();screen='builder';step=1;render();notify('Backup restored.')}}catch(err){notify('This is not a valid Work Order Builder backup.',true)}e.target.value=''};reader.readAsText(file)});
try{render()}catch(error){document.getElementById('app').innerHTML='<div style="margin:40px auto;max-width:700px;background:white;border:1px solid #ddd;border-radius:14px;padding:24px;font-family:Arial"><h2>Work Order Builder could not start</h2><p style="color:#a22">'+text(error&&error.message?error.message:error)+'</p><p>Build '+BUILD+'</p></div>'}
})();
