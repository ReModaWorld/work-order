function notify(message,bad){var old=document.getElementById('toast');if(old&&old.parentNode)old.parentNode.removeChild(old);var box=document.createElement('div');box.id='toast';box.className='toast'+(bad?' bad':'');box.appendChild(document.createTextNode(message));document.body.appendChild(box);setTimeout(function(){if(box.parentNode)box.parentNode.removeChild(box)},2600)}
function parseScope(value){var parts=value.replace(/\r/g,'').split(/(?:[.!?]+\s+|\n+)/),out=[],i,s,q,trade,title,priority;for(i=0;i<parts.length;i++){s=parts[i].replace(/^\s+|\s+$/g,'');if(s.length<4)continue;q=s.toLowerCase();trade='General';if(/electric|power|led|light|outlet|switch/.test(q))trade='Electrical';else if(/frame|build|blocking/.test(q))trade='Framing';else if(/panel|slat|laminate|tile/.test(q))trade='Wall Panels';else if(/plumb|water|drain|faucet/.test(q))trade='Plumbing';else if(/finish|paint|drywall|clean|debris/.test(q))trade='Finishing';priority=/must|critical|required|before/.test(q)?'High':'Normal';title=s.split(/,| and | so /)[0];out.push({id:id(),title:title,trade:trade,area:'',details:s,materials:'Confirm materials and selections with project manager',provider:'',cost:0,sequence:i+1,duration:1,priority:priority,start:'',due:'',dependsOn:'',responsibility:'Company',quantity:1,unit:'LS',labor:0,materialCost:0,equipment:0,acceptance:'Complete as specified, clean the area and submit required documentation.',safety:'Follow site rules and applicable safety requirements.',progress:0,requiredPhotos:2,internalNotes:''})}return out}
function header(){var p=project(),c=state.company,options='',i;for(i=0;i<state.projects.length;i++)options+='<option value="'+text(state.projects[i].id)+'"'+(state.projects[i].id===p.id?' selected':'')+'>'+text(state.projects[i].name||'Untitled Project')+'</option>';return'<header class="top"><div class="mark">'+text((c.name||'C').charAt(0).toUpperCase())+'</div><b class="brand">'+text(c.name||'Your Company')+'</b><span class="product">Work Orders</span><div class="projectSelect"><select data-change="project">'+options+'</select><button class="btn soft small" data-action="newProject">+ New</button></div></header>'}
function navigation(){return'<nav class="nav"><button class="'+(screen==='dashboard'?'on':'')+'" data-screen="dashboard">DASHBOARD</button><button class="'+(screen==='builder'?'on':'')+'" data-screen="builder">BUILD</button><button class="'+(screen==='orders'?'on':'')+'" data-screen="orders">ORDERS</button><button class="'+(screen==='templates'?'on':'')+'" data-screen="templates">TEMPLATES</button><button class="'+(screen==='providers'?'on':'')+'" data-screen="providers">PROVIDERS</button><button class="bottom '+(screen==='settings'?'on':'')+'" data-screen="settings">SETTINGS</button></nav>'}
function titleBar(titleValue,sub,buttons){return'<div class="title"><div><span class="eyebrow">PROJECT OPERATIONS</span><h1>'+text(titleValue)+'</h1><p>'+text(sub)+'</p></div><div class="actions">'+buttons+'</div></div>'}
function matchScore(t,pr){var score=25;if(String(pr.trade).toLowerCase()===String(t.trade).toLowerCase())score+=45;if(String(pr.skills||'').toLowerCase().indexOf(String(t.trade).toLowerCase())>-1)score+=15;if(pr.preferred)score+=10;if(pr.insured)score+=5;return Math.min(100,score)}
function taskRows(assign){var p=project(),html='',i,t,opts,j,pr,best,bestScore,score;if(!p.tasks.length)return'<div class="empty">No tasks yet.<br>Convert the scope, apply a template or add a task manually.</div>';p.tasks.sort(function(a,b){return Number(a.sequence||0)-Number(b.sequence||0)});for(i=0;i<p.tasks.length;i++){t=p.tasks[i];opts='';best='';bestScore=0;if(assign){opts='<select data-assign="'+text(t.id)+'"><option value="">Choose provider…</option>';for(j=0;j<state.providers.length;j++){pr=state.providers[j];score=matchScore(t,pr);if(score>bestScore){bestScore=score;best=pr.name}opts+='<option value="'+text(pr.id)+'"'+(t.provider===pr.id?' selected':'')+'>'+text(pr.name)+' — '+text(pr.trade)+' ('+score+'% match)</option>'}opts+='</select><div class="match">Recommended: '+text(best)+' · '+bestScore+'% match</div>'}html+='<div class="row"><div class="dragBtns"><button data-action="moveTaskUp" data-id="'+text(t.id)+'">↑</button><button data-action="moveTaskDown" data-id="'+text(t.id)+'">↓</button></div><div class="rowBody"><div><span class="tag">'+text(t.trade)+'</span><b>'+text(t.sequence)+'. '+text(t.title)+'</b></div><div class="taskMeta"><span class="mini '+(t.priority==='High'?'warn':'')+'">'+text(t.priority)+'</span><span class="mini">'+text(t.duration)+' day'+(Number(t.duration)===1?'':'s')+'</span><span class="mini">'+text(t.responsibility)+' materials</span><span class="mini">'+text(t.progress)+'% complete</span><span class="mini">$'+dollars(taskTotal(t))+'</span></div><p>'+text(t.details)+'</p>'+opts+'</div><button class="icon" data-action="duplicateTask" data-id="'+text(t.id)+'">Copy</button><button class="icon" data-action="editTask" data-id="'+text(t.id)+'">Edit</button><button class="icon" data-action="deleteTask" data-id="'+text(t.id)+'">Delete</button></div>'}return html}
function taskPanel(assign){var p=project(),un=0,i;for(i=0;i<p.tasks.length;i++)if(!p.tasks[i].provider)un++;return'<section class="panel"><div class="panelHead"><div><h2>'+(assign?'Assign every task':'Task pool')+'</h2><p>'+p.tasks.length+' editable tasks · '+un+' unassigned</p></div><button class="btn small" data-action="addTask">+ Add task</button></div><div class="list">'+taskRows(assign)+'</div>'+(p.tasks.length?'<button class="btn primary full" data-next="'+(assign?'3':'2')+'">'+(assign?'Review assignments':'Continue to assignments')+'</button>':'')+'</section>'}
function providersPool(){var p=project(),html='',i,j,pr,n;for(i=0;i<state.providers.length;i++){pr=state.providers[i];n=0;for(j=0;j<p.tasks.length;j++)if(p.tasks[j].provider===pr.id)n++;html+='<div class="row provider"><div class="avatar">'+text(initials(pr.name))+'</div><div class="rowBody"><b>'+text(pr.name)+'</b><p>'+text(pr.trade)+' · '+text(pr.contact)+'</p></div><span class="count '+(n?'on':'')+'">'+n+' task'+(n===1?'':'s')+'</span></div>'}return'<section class="panel"><div class="panelHead"><div><h2>Provider pool</h2><p>Available companies and current matches.</p></div><button class="btn small" data-action="addProvider">+ Add</button></div><div class="list">'+(html||'<div class="empty">No providers yet.</div>')+'</div></section>'}
function initials(name){var a=String(name||'').split(' '),s='',i;for(i=0;i<a.length&&i<2;i++)if(a[i])s+=a[i].charAt(0);return s.toUpperCase()}
function builder(){var p=project(),body='',groups,i,j,pid,provider,tasks,total;if(step===1)body='<div class="grid"><section class="panel"><div class="panelHead"><div><h2>Approved scope</h2><p>Paste or edit the scope the builder should read.</p></div></div><textarea class="scope" id="scopeText">'+text(p.scope)+'</textarea><button class="btn primary full" data-action="extract">Convert scope to tasks</button></section>'+taskPanel(false)+'</div>';else if(step===2)body='<div class="grid assign">'+taskPanel(true)+providersPool()+'</div>';else{groups=[];for(i=0;i<p.tasks.length;i++)if(p.tasks[i].provider&&groups.indexOf(p.tasks[i].provider)<0)groups.push(p.tasks[i].provider);body='<section class="panel"><div class="panelHead"><div><h2>Review work order package</h2><p>One work order will be created for each assigned provider.</p></div></div>';if(!groups.length)body+='<div class="empty">No assigned work. Return to step 2 and match tasks with providers.</div>';for(i=0;i<groups.length;i++){pid=groups[i];provider=find(state.providers,pid);tasks=0;total=0;for(j=0;j<p.tasks.length;j++)if(p.tasks[j].provider===pid){tasks++;total+=Number(p.tasks[j].cost||0)}body+='<div class="row provider"><div class="avatar">WO</div><div class="rowBody"><b>'+text(provider?provider.name:'Provider')+'</b><p>'+tasks+' assigned tasks</p></div><b>$'+dollars(total)+'</b></div>'}body+='<button class="btn primary full" data-action="generate">Generate '+groups.length+' work order'+(groups.length===1?'':'s')+'</button></section>'}return titleBar('Work Order Builder',p.name+' · '+p.number,'<button class="btn" data-action="editProject">Project details</button><button class="btn primary" data-action="generate">Generate work orders</button>')+'<div class="content"><div class="steps"><button class="step '+(step===1?'on':'')+'" data-step="1"><i>1</i><strong>Scope & tasks</strong></button><span>›</span><button class="step '+(step===2?'on':'')+'" data-step="2"><i>2</i><strong>Assign providers</strong></button><span>›</span><button class="step '+(step===3?'on':'')+'" data-step="3"><i>3</i><strong>Review & generate</strong></button></div>'+body+'</div>'}
function dashboard(){var p=project(),unassigned=0,attention=0,complete=0,i,o,warnings='',value=0,openIssues=0;for(i=0;i<p.tasks.length;i++){if(!p.tasks[i].provider)unassigned++;value+=taskTotal(p.tasks[i])}for(i=0;i<p.orders.length;i++){o=p.orders[i];if(o.status==='Completed'||o.status==='Closed')complete++;if(o.status==='Sent'&&!o.viewedDate){attention++;warnings+='<div class="warningItem">Sent but not viewed: '+text(o.number)+'<strong>'+text(find(state.providers,o.provider)?find(state.providers,o.provider).name:'Provider')+'</strong></div>'}if(o.acceptance&&o.acceptance.status==='Pending'&&o.status!=='Draft'){attention++;warnings+='<div class="warningItem">Waiting for acceptance: '+text(o.number)+'<strong>'+text(o.status)+'</strong></div>'}}for(i=0;i<p.issues.length;i++)if(p.issues[i].status!=='Closed')openIssues++;if(unassigned)warnings+='<div class="warningItem">Tasks waiting for provider assignment<strong>'+unassigned+'</strong></div>';if(openIssues)warnings+='<div class="warningItem">Open issues or field changes<strong>'+openIssues+'</strong></div>';return titleBar('Work order control center',p.name+' · '+p.number,'<button class="btn" data-action="addIssue">Report issue</button><button class="btn" data-action="addAttachment">Add attachment</button><button class="btn primary" data-screen="builder">Build work orders</button>')+'<div class="content"><div class="kpis"><div class="kpi"><span>Total work orders</span><b>'+p.orders.length+'</b></div><div class="kpi"><span>Unassigned tasks</span><b>'+unassigned+'</b></div><div class="kpi alert"><span>Needs attention</span><b>'+attention+'</b></div><div class="kpi"><span>Completed</span><b>'+complete+'</b></div><div class="kpi"><span>Provider commitments</span><b>$'+dollars(value)+'</b></div></div><div class="split"><section class="panel"><div class="panelHead"><div><h2>Operational warnings</h2><p>Items that need action before work can move forward.</p></div></div><div class="warningList">'+(warnings||'<div class="empty">No current warnings.</div>')+'</div></section><section class="panel"><div class="panelHead"><div><h2>Project execution readiness</h2><p>Scope, assignment, documentation and closeout readiness.</p></div></div>'+readinessRows(p)+'</section></div><div class="sectionTitle"><h2>Attachments and selections</h2><button class="btn small" data-action="addAttachment">+ Add file</button></div><section class="panel">'+attachmentList(p)+'</section><div class="sectionTitle"><h2>Issues and field changes</h2><button class="btn small" data-action="addIssue">+ New issue</button></div><section class="panel">'+issueList(p)+'</section></div>'}
function readinessRows(p){var assigned=p.tasks.length?p.tasks.filter(function(t){return!!t.provider}).length/p.tasks.length*100:0,accepted=p.orders.length?p.orders.filter(function(o){return o.acceptance&&o.acceptance.status==='Accepted'}).length/p.orders.length*100:0,closed=p.orders.length?p.orders.filter(function(o){return o.status==='Completed'||o.status==='Closed'}).length/p.orders.length*100:0;return progressRow('Scope converted',p.tasks.length?100:0)+progressRow('Provider assignments',assigned)+progressRow('Provider acceptance',accepted)+progressRow('Completion and closeout',closed)}
function progressRow(label,n){n=Math.round(n||0);return'<div style="margin:13px 0"><div style="display:flex;justify-content:space-between;font-size:11px"><b>'+text(label)+'</b><span>'+n+'%</span></div><div class="progressTrack"><i style="width:'+n+'%"></i></div></div>'}
function attachmentList(p){var html='',i,a;for(i=0;i<p.attachments.length;i++){a=p.attachments[i];html+='<div class="attachment">'+(a.data&&String(a.type).indexOf('image')===0?'<img src="'+a.data+'">':'<div class="avatar">FILE</div>')+'<div class="grow"><b>'+text(a.name)+'</b><p>'+text(a.category)+' · '+text(a.visibility)+(a.required?' · Required acknowledgment':'')+'</p></div><button class="icon" data-action="deleteAttachment" data-id="'+text(a.id)+'">Delete</button></div>'}return html||'<div class="empty">No drawings, photos, selections or specifications attached yet.</div>'}
function issueList(p){var html='',i,x;for(i=0;i<p.issues.length;i++){x=p.issues[i];html+='<div class="issue"><div class="issueHead"><b>'+text(x.title)+'</b><span class="pill '+(x.priority==='High'?'high':'')+'">'+text(x.type)+' · '+text(x.status)+'</span></div><p>'+text(x.details)+'</p><div class="actions"><button class="btn small" data-action="editIssue" data-id="'+text(x.id)+'">Edit</button><button class="btn small" data-action="convertIssue" data-id="'+text(x.id)+'">Convert to task</button><button class="btn small danger" data-action="deleteIssue" data-id="'+text(x.id)+'">Delete</button></div></div>'}return html||'<div class="empty">No hidden conditions, delays, clarification requests or field changes.</div>'}
function templatesPage(){var html='',i,x;for(i=0;i<state.templates.length;i++){x=state.templates[i];html+='<article class="templateCard"><span class="tag">'+text(x.service)+'</span><h3>'+text(x.name)+'</h3><p>'+text(x.description)+'</p><div class="meta"><span>'+x.tasks.length+' tasks</span></div><div class="actions"><button class="btn small primary" data-action="applyTemplate" data-id="'+text(x.id)+'">Apply to project</button><button class="btn small" data-action="editTemplate" data-id="'+text(x.id)+'">Edit</button><button class="btn small danger" data-action="deleteTemplate" data-id="'+text(x.id)+'">Delete</button></div></article>'}return titleBar('Work order templates','Reusable task packages, standards and closeout requirements.','<button class="btn" data-action="saveAsTemplate">Save current project as template</button><button class="btn primary" data-action="addTemplate">+ New template</button>')+'<div class="content"><div class="templateGrid">'+html+'</div></div>'}
function orders(){var p=project(),html='',i,o,pr,total,list=[],statusOptions=['All','Draft','Ready to Send','Sent','Viewed','Accepted','Scheduled','In Progress','Submitted for Review','Completed','Closed','Cancelled'],opts='';for(i=0;i<statusOptions.length;i++)opts+='<option'+(orderStatus===statusOptions[i]?' selected':'')+'>'+statusOptions[i]+'</option>';for(i=0;i<p.orders.length;i++){o=p.orders[i];pr=find(state.providers,o.provider);if(orderStatus!=='All'&&o.status!==orderStatus)continue;if(orderSearch&&String(o.number+' '+(pr?pr.name:'')+' '+o.status).toLowerCase().indexOf(orderSearch.toLowerCase())<0)continue;list.push(o)}for(i=0;i<list.length;i++){o=list[i];pr=find(state.providers,o.provider);total=orderTotal(p,o);html+='<article class="card"><span class="status '+((o.status==='Completed'||o.status==='Closed')?'done':'')+'">'+text(o.status)+'</span><h3>'+text(o.number)+'</h3><p>'+text(pr?pr.name:'Provider unavailable')+'</p><div class="taskMeta"><span class="mini">'+o.tasks.length+' tasks</span><span class="mini">Acceptance: '+text(o.acceptance?o.acceptance.status:'Pending')+'</span><span class="mini">Rev '+o.revisions.length+'</span></div><div class="meta"><span>$'+dollars(total)+'</span><span>'+o.checklist.filter(function(c){return c.done}).length+'/'+o.checklist.length+' closeout</span></div><div class="cardActions"><button class="btn small" data-action="openOrder" data-id="'+text(o.id)+'">Open</button><button class="btn small" data-action="duplicateOrder" data-id="'+text(o.id)+'">Duplicate</button><button class="btn small" data-action="printOrder" data-id="'+text(o.id)+'">PDF</button><button class="btn small" data-action="shareOrder" data-id="'+text(o.id)+'">Share</button><button class="btn small danger" data-action="deleteOrder" data-id="'+text(o.id)+'">Delete</button></div></article>'}return titleBar('Work orders',p.name+' · '+p.number,'<button class="btn primary" data-screen="builder">+ Build work order</button>')+'<div class="content"><div class="toolbar"><div class="filters"><input id="orderSearch" placeholder="Search work orders" value="'+text(orderSearch)+'"><select id="orderStatus">'+opts+'</select></div><span>'+list.length+' shown · '+p.orders.length+' total</span></div><div class="cards">'+(html||'<div class="panel empty">No matching work orders.</div>')+'</div></div>'}
function providerPage(){var html='',i,p,used,j,k;for(i=0;i<state.providers.length;i++){p=state.providers[i];used=0;for(j=0;j<state.projects.length;j++)for(k=0;k<state.projects[j].tasks.length;k++)if(state.projects[j].tasks[k].provider===p.id)used++;html+='<tr><td><b>'+text(p.name)+'</b><small>'+(p.preferred?'Preferred provider':'Standard provider')+'</small></td><td><span class="tag">'+text(p.trade)+'</span><small>'+text(p.skills)+'</small></td><td>'+text(p.contact)+'<small>'+text(p.email)+'</small></td><td>'+text(p.availability)+'<small>'+text(p.serviceArea)+'</small></td><td>'+text(p.rating)+' / 5<small>'+(p.insured?'Insurance verified':'Insurance missing')+'</small></td><td>'+used+'</td><td><button class="btn small" data-action="editProvider" data-id="'+text(p.id)+'">Edit</button> <button class="btn small danger" data-action="deleteProvider" data-id="'+text(p.id)+'">Delete</button></td></tr>'}return titleBar('Providers','Skill matching, availability, compliance and assignment history.','<button class="btn primary" data-action="addProvider">+ Add provider</button>')+'<div class="content"><div class="panel tableWrap"><table><thead><tr><th>Provider</th><th>Trade / Skills</th><th>Contact</th><th>Availability</th><th>Quality / Compliance</th><th>Assigned</th><th></th></tr></thead><tbody>'+html+'</tbody></table></div></div>'}
function settings(){var c=state.company;return titleBar('Company, documents and data','Customize business identity, provider-facing documents and stored records.','<button class="btn" data-action="editCompany">Edit company and document settings</button>')+'<div class="content"><div class="grid"><section class="panel compact"><h2>'+text(c.name||'Your Company')+'</h2><p>'+text(c.address)+'</p><p>'+text(c.phone)+(c.phone&&c.email?' · ':'')+text(c.email)+'</p><hr><p><b>Document title:</b> '+text(c.documentTitle)+'</p><p><b>Pricing visibility:</b> '+(c.showPricing?'Shown to provider':'Hidden from provider')+'</p><p><b>Default terms:</b> '+text(c.defaultTerms).substring(0,150)+'…</p><button class="btn" data-action="editCompany">Edit company and document settings</button></section><section class="panel"><h2>Backup and restore</h2><p style="font-size:12px;color:#748092;line-height:1.6">Download every project, provider, task, attachment, acceptance record, issue, revision and work order as one transferable backup.</p><button class="btn primary" data-action="backup">Download complete backup</button> <button class="btn" data-action="restore">Restore backup</button><hr><button class="btn" data-action="exportProject">Export active project JSON</button></section></div><div class="notice"><b>Standalone mode:</b> All workflows are functional on this device. Secure external links, automatic email/text delivery, multi-user permissions and live OpenAI processing will activate when connected to the Oprit backend. Build '+BUILD+'.</div></div>'}
function render(){var main=screen==='dashboard'?dashboard():screen==='builder'?builder():screen==='orders'?orders():screen==='templates'?templatesPage():screen==='providers'?providerPage():settings();document.getElementById('app').innerHTML=header()+'<div class="layout">'+navigation()+'<main class="main">'+main+'</main></div>'+modalHtml()+previewHtml();document.title='Work Order Builder — '+BUILD}
function field(label,name,value,wide,type){return'<label class="field '+(wide?'wide':'')+'"><span>'+label+'</span><input name="'+name+'" type="'+(type||'text')+'" value="'+text(value)+'"></label>'}

function modalHtml(){var p=project(),x,body='',i;if(!modalType)return'';if(modalType==='task'){x=find(p.tasks,modalId)||{id:modalId,title:'',trade:'General',area:'',details:'',materials:'',provider:'',sequence:p.tasks.length+1,duration:1,priority:'Normal',start:'',due:'',dependsOn:'',responsibility:'Company',quantity:1,unit:'LS',labor:0,materialCost:0,equipment:0,acceptance:'',safety:'',progress:0,requiredPhotos:2,internalNotes:''};body='<div class="form">'+field('Task title','title',x.title,true)+field('Trade','trade',x.trade,false)+field('Area / room','area',x.area,false)+field('Sequence','sequence',x.sequence,false,'number')+field('Duration (days)','duration',x.duration,false,'number')+'<label class="field"><span>Priority</span><select name="priority"><option'+(x.priority==='Normal'?' selected':'')+'>Normal</option><option'+(x.priority==='High'?' selected':'')+'>High</option><option'+(x.priority==='Critical'?' selected':'')+'>Critical</option></select></label>'+field('Planned start','start',x.start,false,'date')+field('Due date','due',x.due,false,'date')+field('Depends on task / milestone','dependsOn',x.dependsOn,false)+area('Provider instructions','details',x.details)+area('Materials and selections','materials',x.materials)+'<label class="field"><span>Materials provided by</span><select name="responsibility"><option'+(x.responsibility==='Company'?' selected':'')+'>Company</option><option'+(x.responsibility==='Provider'?' selected':'')+'>Provider</option><option'+(x.responsibility==='Client'?' selected':'')+'>Client</option></select></label>'+field('Quantity','quantity',x.quantity,false,'number')+field('Unit','unit',x.unit,false)+field('Labor','labor',x.labor,false,'number')+field('Materials cost','materialCost',x.materialCost,false,'number')+field('Equipment / other','equipment',x.equipment,false,'number')+field('Progress %','progress',x.progress,false,'number')+field('Required photos','requiredPhotos',x.requiredPhotos,false,'number')+area('Completion / acceptan
