<script>
window.addEventListener("error",function(event){
  var root=document.getElementById("app");
  if(root&&!root.innerHTML){
    root.innerHTML='<div style="margin:40px auto;max-width:720px;background:white;border:1px solid #e0e5ea;border-radius:14px;padding:24px;font-family:Arial;color:#142237"><h2 style="margin-top:0">The Work Order Builder could not start</h2><p style="line-height:1.6;color:#667085">Please refresh the page. If this message remains, redeploy the original <b>index.html</b> file without editing or processing it.</p><p style="font-size:12px;color:#a33">'+String(event.message||"Browser error")+'</p></div>';
  }
});
"use strict";
const I={
 hammer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 12-8.5 8.5a2.12 2.12 0 0 1-3-3L12 9"/><path d="m17.64 15 4.24-4.24"/><path d="m20.71 7.71-4.42-4.42a1 1 0 0 0-1.41 0l-2.59 2.59a1 1 0 0 0 0 1.41l4.42 4.42a1 1 0 0 0 1.41 0l2.59-2.59a1 1 0 0 0 0-1.41Z"/></svg>',
 file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5Z"/><polyline points="14 2 14 8 20 8"/></svg>',

 trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6M14 11v6"/></svg>',
 print:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',

 download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 21h14"/></svg>',
 upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M5 20h14"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
 save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>',
 clipboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 9h6M9 13h6"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4H21v4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg>'
};
const KEY="work-order-builder-standalone-v3";
const uid=()=>Math.random().toString(36).slice(2,10);
const sampleProject=()=>({id:uid(),name:"Living Room Fireplace Feature",number:"PRJ-2026-0148",client:"Jordan & Taylor Morgan",address:"4821 Willow Bend Drive, Plano, TX 75093",contact:"Jordan Morgan",phone:"(469) 555-0194",start:"2026-09-08",end:"2026-09-12",access:"Use front entrance. Protect flooring from entry to work area. Coordinate arrival with the project manager.",scope:"Prepare and protect the living room work area. Build an approximately 7 ft wide frame, approximately 6 inches deep or as required for the homeowner-provided electric fireplace. Install the electric fireplace and connect it to the nearest available power source. Install warm-white remote-controlled LED lighting vertically on both sides. Install selected wall panels from the top of the baseboard to the ceiling. Cut and finish a recessed opening so the television sits flush with the panels. Complete finish details, remove debris, and leave the area clean.",tasks:[],orders:[]});
const fresh=()=>{const p=sampleProject();return{company:{name:"Your Company",phone:"",email:"",address:""},providers:[{id:"p1",name:"Northstar Carpentry",trade:"Framing",contact:"Marco Diaz",phone:"(214) 555-0137",email:"marco@northstar.example"},{id:"p2",name:"BrightLine Electric",trade:"Electrical",contact:"Andre Lewis",phone:"(972) 555-0188",email:"andre@brightline.example"},{id:"p3",name:"Precision Panel Works",trade:"Wall Panels",contact:"Eli Turner",phone:"(469) 555-0171",email:"eli@precisionpanel.example"}],projects:[p],active:p.id}};
let db=load(),view="build",step=1,modal=null,previewId=null,search="";
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.projects&&x.providers)return x}catch(e){}return fresh()}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function active(){return db.projects.find(x=>x.id===db.active)||db.projects[0]}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(v){return Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function toast(msg,bad=false){document.querySelector(".toast")?.remove();const x=document.createElement("div");x.className="toast"+(bad?" bad":"");x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}
function parseScope(scope){return scope.replace(/\r/g,"").split(/(?:[.!?]+\s+|\n+)/).map(s=>s.trim()).filter(s=>s.length>3).map(s=>{const q=s.toLowerCase();let trade="General";if(/electric|power|led|light|outlet|switch/.test(q))trade="Electrical";else if(/frame|build|blocking/.test(q))trade="Framing";else if(/panel|slat|laminate|tile/.test(q))trade="Wall Panels";else if(/finish|paint|drywall|clean|debris/.test(q))trade="Finishing";return{id:uid(),title:s.split(/,| and | so /)[0],trade,area:"",details:s,materials:"Confirm with project manager",provider:"",cost:0}})}
function render(){const p=active();document.getElementById("app").innerHTML=top(p)+`<div class="shell">${side()}<main class="main">${view==="build"?builder(p):view==="orders"?ordersPage(p):view==="providers"?providersPage(p):settingsPage()}</main></div>${modal?modalHTML():""}${previewId?previewHTML(p):""}`;bind()}
function top(p){const c=db.company||{},name=c.name||"Your Company",initial=name.trim().charAt(0).toUpperCase()||"C";return `<header class="topbar"><div class="logo">${esc(initial)}</div><b class="brand">${esc(name)}</b><i class="crumb">/</i><span class="product">Work Orders</span><div class="project-switch"><select id="projectSwitch">${db.projects.map(x=>`<option value="${x.id}" ${x.id===p.id?"selected":""}>${esc(x.name||"Untitled Project")}</option>`).join("")}</select><button class="btn soft small" data-action="newProject">${I.plus} New</button></div></header>`}
function side(){return `<aside class="sidebar"><button class="nav ${view==="build"?"active":""}" data-view="build" title="Builder">${I.hammer}</button><button class="nav ${view==="orders"?"active":""}" data-view="orders" title="Work Orders">${I.file}</button><button class="nav ${view==="providers"?"active":""}" data-view="providers" title="Providers">${I.users}</button><button class="nav bottom ${view==="settings"?"active":""}" data-view="settings" title="Data & Settings">${I.gear}</button></aside>`}
function builder(p){return `<div class="titlebar"><div><span class="eyebrow">${esc(p.number||"NEW PROJECT")}</span><h1>Work Order Builder</h1><p>${esc(p.name||"Untitled Project")}</p></div><div class="actions"><button class="btn secondary" data-action="editProject">${I.pencil} Project details</button><button class="btn primary" data-action="generate">${I.hammer} Generate work orders</button></div></div><div class="content"><div class="steps"><button class="step ${step===1?"active":""}" data-step="1"><span>1</span><b>Scope & tasks</b></button><span class="chev">›</span><button class="step ${step===2?"active":""}" data-step="2"><span>2</span><b>Assign providers</b></button><span class="chev">›</span><button class="step ${step===3?"active":""}" data-step="3"><span>3</span><b>Review & generate</b></button></div>${step===1?scopeStep(p):step===2?assignStep(p):reviewStep(p)}</div>`}
function scopeStep(p){return `<div class="twocol"><section class="panel"><div class="panelhead"><div><h2>Approved scope</h2><p>Paste or edit the scope the builder should read.</p></div>${I.file}</div><textarea id="scope" class="scope">${esc(p.scope)}</textarea><button class="btn primary full" data-action="extract">${I.hammer} Convert scope to tasks</button></section>${taskPanel(p,false)}</div>`}
function assignStep(p){return `<div class="twocol assign">${taskPanel(p,true)}${providerPool(p)}</div>`}
function taskPanel(p,assign){return `<section class="panel"><div class="panelhead"><div><h2>${assign?"Assign every task":"Task pool"}</h2><p>${p.tasks.length} editable tasks · ${p.tasks.filter(t=>!t.provider).length} unassigned</p></div><button class="iconbtn" data-action="addTask">${I.plus}</button></div><div class="tasklist">${p.tasks.length?p.tasks.map(t=>taskRow(t,assign)).join(""):`<div class="empty">${I.hammer}<b>No tasks yet</b><span>Convert the scope or add a task manually.</span></div>`}</div>${p.tasks.length?`<button class="btn primary full" data-next="${assign?3:2}">${assign?"Review assignments":"Continue to assignments"} ›</button>`:""}</section>`}
function taskRow(t,assign){return `<div class="task"><div class="taskbody"><div class="taskline"><em class="tag">${esc(t.trade)}</em><b>${esc(t.title)}</b></div><p>${esc(t.details)}</p>${assign?`<select data-assign="${t.id}"><option value="">Choose provider…</option>${db.providers.map(p=>`<option value="${p.id}" ${t.provider===p.id?"selected":""}>${esc(p.name)} — ${esc(p.trade)}</option>`).join("")}</select>`:""}</div><button class="iconbtn" data-edit-task="${t.id}" title="Edit">${I.pencil}</button><button class="iconbtn danger" data-delete-task="${t.id}" title="Delete">${I.trash}</button></div>`}
function providerPool(p){return `<section class="panel"><div class="panelhead"><div><h2>Provider pool</h2><p>Available companies and current matches.</p></div><button class="btn secondary small" data-action="addProvider">${I.plus} Add</button></div><div class="providerlist">${db.providers.map(x=>{const n=p.tasks.filter(t=>t.provider===x.id).length;return `<div class="provider"><div class="avatar">${esc(x.name.split(" ").map(y=>y[0]).slice(0,2).join(""))}</div><div><b>${esc(x.name)}</b><p>${esc(x.trade)} · ${esc(x.contact)}</p></div><span class="count ${n?"on":""}">${n} task${n===1?"":"s"}</span></div>`}).join("")}</div></section>`}
function reviewStep(p){const groups=[...new Set(p.tasks.filter(t=>t.provider).map(t=>t.provider))];return `<section class="panel"><div class="panelhead"><div><h2>Review work order package</h2><p>One separate work order will be created for each assigned provider.</p></div><div class="avatar">${groups.length}</div></div>${groups.length?groups.map(pid=>{const x=db.providers.find(y=>y.id===pid),ts=p.tasks.filter(t=>t.provider===pid);return `<div class="review-row"><div class="avatar">${I.hammer}</div><div><b>${esc(x?.name)}</b><p>${esc(x?.trade)} · ${ts.length} assigned tasks</p></div><strong>$${money(ts.reduce((a,t)=>a+Number(t.cost||0),0))}</strong></div>`}).join(""):`<div class="empty">${I.clipboard}<b>No assigned work</b><span>Return to step 2 and match tasks with providers.</span></div>`}<button class="btn primary full" data-action="generate">${I.hammer} Generate ${groups.length||""} work order${groups.length===1?"":"s"}</button></section>`}
function ordersPage(p){const list=p.orders.filter(o=>{const x=db.providers.find(y=>y.id===o.provider);return(o.number+" "+(x?.name||"")).toLowerCase().includes(search.toLowerCase())});return `<div class="page"><div class="page-title"><div><span class="eyebrow">PROJECT OPERATIONS</span><h1>Work orders</h1><p>${esc(p.name)} · ${esc(p.number)}</p></div><button class="btn primary" data-view="build">${I.plus} Build work order</button></div><div class="toolbar"><div class="search">${I.search}<input id="search" placeholder="Search work orders" value="${esc(search)}"></div><span>${p.orders.length} total</span></div><div class="cards">${list.length?list.map(o=>orderCard(p,o)).join(""):`<div class="panel empty">${I.file}<b>No work orders yet</b><span>Build tasks, assign providers, and generate the package.</span><button class="btn primary" data-view="build">Start building</button></div>`}</div></div>`}
function orderCard(p,o){const x=db.providers.find(y=>y.id===o.provider),ts=p.tasks.filter(t=>o.tasks.includes(t.id));return `<article class="ordercard"><span class="status ${o.status==="Completed"?"completed":""}">${esc(o.status)}</span><div class="woicon">${I.hammer}</div><h3>${esc(o.number)}</h3><p>${esc(x?.name||"Provider unavailable")}</p><div class="meta"><span>${I.clipboard}${ts.length} tasks</span><span>$${money(ts.reduce((a,t)=>a+Number(t.cost||0),0))}</span></div><div class="cardactions"><button data-open-order="${o.id}">Open</button><button data-print-order="${o.id}" title="Print / PDF">${I.print}</button><button data-share-order="${o.id}" title="Share">${I.share}</button><button data-delete-order="${o.id}" title="Delete">${I.trash}</button></div></article>`}
function providersPage(p){return `<div class="page"><div class="page-title"><div><span class="eyebrow">PROVIDER DIRECTORY</span><h1>Providers</h1><p>Companies available across all projects.</p></div><button class="btn primary" data-action="addProvider">${I.plus} Add provider</button></div><div class="panel tablewrap"><table><thead><tr><th>Provider</th><th>Trade</th><th>Contact</th><th>Phone</th><th>Assigned</th><th></th></tr></thead><tbody>${db.providers.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td><em class="tag">${esc(x.trade)}</em></td><td>${esc(x.contact)}<small>${esc(x.email)}</small></td><td>${esc(x.phone)}</td><td>${db.projects.reduce((n,z)=>n+z.tasks.filter(t=>t.provider===x.id).length,0)}</td><td><div class="rowactions"><button class="iconbtn" data-edit-provider="${x.id}">${I.pencil}</button><button class="iconbtn danger" data-delete-provider="${x.id}">${I.trash}</button></div></td></tr>`).join("")}</tbody></table></div></div>`}
function settingsPage(){return `<div class="page"><div class="page-title"><div><span class="eyebrow">DATA & SETTINGS</span><h1>Backup and company details</h1><p>Customize the business identity and protect all project records.</p></div><button class="btn secondary" data-action="company">${I.pencil} Company details</button></div><div class="backupbox"><section class="panel">${I.download}<h3>Download complete backup</h3><p>Save all projects, providers, tasks, assignments and work orders as a JSON file.</p><button class="btn primary" data-action="backup">${I.download} Download backup</button></section><section class="panel">${I.upload}<h3>Restore a backup</h3><p>Load a previously downloaded Work Order Builder backup file.</p><button class="btn secondary" data-action="restore">${I.upload} Choose backup</button></section></div><div class="warning"><b>Important:</b> This standalone edition stores information in this browser. Download regular backups, especially before clearing browser history or moving to another device. When installed inside a business platform, these records can be connected to that platform's shared database.</div></div>`}
function modalHTML(){if(modal.type==="task")return taskModal(modal.item);if(modal.type==="provider")return providerModal(modal.item);if(modal.type==="project")return projectModal(modal.item,modal.isNew);if(modal.type==="order")return orderModal(modal.item);return companyModal()}
function wrapModal(title,body){return `<div class="modalbg"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="iconbtn" data-action="closeModal">✕</button></div>${body}</div></div>`}
function inputField(label,key,value,wide=false,type="text"){return `<label class="field ${wide?"wide":""}"><span>${label}</span><input data-field="${key}" type="${type}" value="${esc(value)}"></label>`}
function textField(label,key,value,wide=true){return `<label class="field ${wide?"wide":""}"><span>${label}</span><textarea data-field="${key}">${esc(value)}</textarea></label>`}
function taskModal(t){return wrapModal(t.id&&active().tasks.some(x=>x.id===t.id)?"Edit task":"Add task",`<div class="form">${inputField("Task title","title",t.title,true)}${inputField("Trade","trade",t.trade)}${inputField("Area / room","area",t.area)}${textField("Instructions","details",t.details)}${textField("Materials / responsibility","materials",t.materials)}<label class="field"><span>Provider</span><select data-field="provider"><option value="">Unassigned</option>${db.providers.map(x=>`<option value="${x.id}" ${t.provider===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>${inputField("Provider amount","cost",t.cost,false,"number")}</div><div class="modalactions"><button class="btn secondary" data-action="closeModal">Cancel</button><button class="btn primary" data-action="saveTask">${I.save} Save task</button></div>`)}
function providerModal(x){const exists=db.providers.some(p=>p.id===x.id);return wrapModal(exists?"Edit provider":"Add provider",`<div class="form">${inputField("Company name","name",x.name,true)}${inputField("Trade","trade",x.trade)}${inputField("Contact name","contact",x.contact)}${inputField("Phone","phone",x.phone)}${inputField("Email","email",x.email)}</div><div class="modalactions"><button class="btn secondary" data-action="closeModal">Cancel</button><button class="btn primary" data-action="saveProvider">${I.save} Save provider</button></div>`)}
function projectModal(p,isNew){return wrapModal(isNew?"New project":"Project and site details",`<div class="form">${inputField("Project name","name",p.name,true)}${inputField("Project number","number",p.number)}${inputField("Client","client",p.client)}${inputField("Site contact","contact",p.contact)}${inputField("Phone","phone",p.phone)}${inputField("Address","address",p.address,true)}${inputField("Start date","start",p.start,false,"date")}${inputField("Completion date","end",p.end,false,"date")}${textField("Access and site instructions","access",p.access)}</div><div class="modalactions"><button class="btn secondary" data-action="closeModal">Cancel</button><button class="btn primary" data-action="saveProject">${I.save} Save project</button></div>`)}
function orderModal(o){return wrapModal("Edit work order",`<div class="form">${inputField("Work order number","number",o.number)}<label class="field"><span>Status</span><select data-field="status">${["Draft","Sent","Accepted","Scheduled","In Progress","Submitted for Review","Completed","Cancelled"].map(x=>`<option ${o.status===x?"selected":""}>${x}</option>`).join("")}</select></label>${textField("Provider notes","notes",o.notes)}${textField("Work order conditions","terms",o.terms)}</div><div class="modalactions"><button class="btn secondary" data-action="closeModal">Cancel</button><button class="btn primary" data-action="saveOrder">${I.save} Save work order</button></div>`)}
function companyModal(){const c=db.company;return wrapModal("Company details",`<div class="form">${inputField("Company name","name",c.name,true)}${inputField("Phone","phone",c.phone)}${inputField("Email","email",c.email)}${inputField("Address","address",c.address,true)}</div><div class="modalactions"><button class="btn secondary" data-action="closeModal">Cancel</button><button class="btn primary" data-action="saveCompany">${I.save} Save company</button></div>`)}
function getFields(){const out={};document.querySelectorAll("[data-field]").forEach(x=>out[x.dataset.field]=x.value);return out}
function generate(){const p=active(),assigned=p.tasks.filter(t=>t.provider);if(!assigned.length)return toast("Assign at least one task first",true);const groups=[...new Set(assigned.map(t=>t.provider))],old=new Map(p.orders.map(o=>[o.provider,o]));p.orders=groups.map((pid,i)=>{const prior=old.get(pid);return prior?{...prior,tasks:assigned.filter(t=>t.provider===pid).map(t=>t.id)}:{id:uid(),number:`WO-${new Date().getFullYear()}-${String(i+1).padStart(3,"0")}`,provider:pid,tasks:assigned.filter(t=>t.provider===pid).map(t=>t.id),status:"Draft",date:new Date().toISOString().slice(0,10),notes:"Coordinate arrival with the project manager before beginning work.",terms:"Do not perform additional work without written approval. Protect existing finishes, maintain a clean work area, report concealed conditions immediately, and provide completion photos before final payment."}});save();view="orders";toast(`${p.orders.length} work order${p.orders.length===1?"":"s"} generated`);render()}
function previewHTML(p){const o=p.orders.find(x=>x.id===previewId);if(!o){previewId=null;return""}const x=db.providers.find(y=>y.id===o.provider),ts=p.tasks.filter(t=>o.tasks.includes(t.id));return `<div class="preview"><div class="previewbar"><button class="iconbtn" data-action="closePreview">${I.back}</button><div><b>${esc(o.number)}</b><span>Provider work order</span></div><div class="spacer"></div><select data-status="${o.id}">${["Draft","Sent","Accepted","Scheduled","In Progress","Submitted for Review","Completed","Cancelled"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select><button class="btn secondary" data-edit-order="${o.id}">${I.pencil} Edit</button><button class="btn secondary" data-share-order="${o.id}">${I.share} Share</button><button class="btn primary" data-print-order="${o.id}">${I.download} Export PDF</button></div><div class="paper">${documentHTML(p,o,x,ts)}</div></div>`}
function companyContact(){const c=db.company||{},parts=[c.address,c.phone,c.email].filter(Boolean);return parts.length?`<p>${parts.map(esc).join(" · ")}</p>`:""}
function documentHTML(p,o,x,ts){const total=ts.reduce((a,t)=>a+Number(t.cost||0),0),c=db.company;return `<div class="wohead"><div><div class="docbrand">${esc(c.name||"Your Company")}<i>.</i></div>${companyContact()}<p>Provider Work Authorization</p></div><div class="wotitle"><h1>WORK ORDER</h1><p>${esc(o.number)}</p><p>Issued ${new Date(o.date+"T00:00:00").toLocaleDateString()}</p></div></div><div class="docgrid"><div><div class="doclabel">Project</div><div class="docinfo"><b>${esc(p.name)}</b><br>${esc(p.number)}<br>${esc(p.address)}</div></div><div><div class="doclabel">Assigned provider</div><div class="docinfo"><b>${esc(x?.name||"")}</b><br>${esc(x?.contact||"")} · ${esc(x?.trade||"")}<br>${esc(x?.phone||"")} · ${esc(x?.email||"")}</div></div><div><div class="doclabel">Client / Site contact</div><div class="docinfo"><b>${esc(p.client)}</b><br>${esc(p.contact)}<br>${esc(p.phone)}</div></div><div><div class="doclabel">Schedule</div><div class="docinfo"><b>${esc(p.start)} — ${esc(p.end)}</b><br>Status: ${esc(o.status)}</div></div></div><div class="docsection"><h2>Site access and preparation</h2><p>${esc(p.access)}</p></div><div class="docsection"><h2>Assigned scope of work</h2>${ts.map((t,i)=>`<div class="doctask"><span class="docnum">${i+1}</span><div><b>${esc(t.title)}</b><p>${esc(t.details)}</p><p><strong>Area:</strong> ${esc(t.area||"As shown")} · <strong>Materials:</strong> ${esc(t.materials)}</p></div><div class="docamount">${t.cost?"$"+money(t.cost):""}</div></div>`).join("")}<div class="doctotal"><b>Provider total</b><b>$${money(total)}</b></div></div><div class="docsection"><h2>Provider notes</h2><p>${esc(o.notes)}</p></div><div class="docsection"><h2>Work order conditions</h2><div class="docterms">${esc(o.terms)}</div></div><div class="signatures"><div class="sig">Authorized by / Date</div><div class="sig">Provider acceptance / Date</div></div>`}
const printCSS=`*{box-sizing:border-box}body{font:13px Arial;color:#172337;margin:0;background:#eee}main{width:8.5in;min-height:11in;margin:auto;background:#fff;padding:.55in}.wohead{display:flex;justify-content:space-between;border-bottom:3px solid #111d2b;padding-bottom:22px}.docbrand{font-size:27px;font-weight:800}.docbrand i{font-style:normal;color:#7758ee}.wotitle{text-align:right}.wotitle h1{margin:0}.wotitle p{margin:5px 0;color:#667085}.docgrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:26px 0}.doclabel{font-size:10px;letter-spacing:1.3px;color:#7b8492;font-weight:bold;text-transform:uppercase;margin-bottom:7px}.docinfo{line-height:1.7}.docsection{margin-top:25px}.docsection h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #ccd1d8;padding-bottom:8px}.doctask{display:grid;grid-template-columns:28px 1fr 90px;border-bottom:1px solid #e5e7eb;padding:13px 0;gap:10px}.docnum{width:24px;height:24px;background:#111d2b;color:#fff;border-radius:50%;display:grid;place-items:center;font-size:11px}.doctask b{display:block}.doctask p{margin:4px 0;color:#596273;line-height:1.5}.docamount{text-align:right;font-weight:bold}.doctotal{display:flex;justify-content:flex-end;gap:35px;margin-top:18px;font-size:15px}.docterms{font-size:11px;line-height:1.6;background:#f4f5f7;padding:14px}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:45px;margin-top:55px}.sig{border-top:1px solid #333;padding-top:7px;color:#667085;font-size:11px}@media print{body{background:#fff}main{margin:0}}`;
function printOrder(id){const p=active(),o=p.orders.find(x=>x.id===id),x=db.providers.find(y=>y.id===o?.provider),ts=p.tasks.filter(t=>o?.tasks.includes(t.id));if(!o)return;const w=window.open("","_blank");if(!w)return toast("Allow pop-ups to export the PDF",true);w.document.write(`<!doctype html><html><head><title>${esc(o.number)}</title><style>${printCSS}</style></head><body><main>${documentHTML(p,o,x,ts)}</main></body></html>`);w.document.close();setTimeout(()=>w.print(),250)}
async function shareOrder(id){const p=active(),o=p.orders.find(x=>x.id===id),x=db.providers.find(y=>y.id===o?.provider);if(!o)return;const text=`${o.number} — ${p.name}\nProvider: ${x?.name||""}\n${o.tasks.length} assigned tasks\n${p.address}`;try{if(navigator.share)await navigator.share({title:o.number,text});else{await navigator.clipboard.writeText(text);toast("Work order summary copied")}}catch(e){}}
function bind(){
 document.querySelectorAll("[data-view]").forEach(x=>x.onclick=()=>{view=x.dataset.view;previewId=null;render()});
 document.querySelectorAll("[data-step]").forEach(x=>x.onclick=()=>{step=Number(x.dataset.step);render()});
 document.querySelectorAll("[data-next]").forEach(x=>x.onclick=()=>{step=Number(x.dataset.next);render()});
 const sw=document.getElementById("projectSwitch");if(sw)sw.onchange=()=>{db.active=sw.value;save();previewId=null;render()};
 const scope=document.getElementById("scope");if(scope)scope.oninput=()=>{active().scope=scope.value;save()};
 const sr=document.getElementById("search");if(sr)sr.oninput=()=>{search=sr.value;render()};
 document.querySelectorAll("[data-assign]").forEach(x=>x.onchange=()=>{const t=active().tasks.find(y=>y.id===x.dataset.assign);t.provider=x.value;save();render()});
 document.querySelectorAll("[data-edit-task]").forEach(x=>x.onclick=()=>{modal={type:"task",item:{...active().tasks.find(y=>y.id===x.dataset.editTask)}};render()});
 document.querySelectorAll("[data-delete-task]").forEach(x=>x.onclick=()=>{if(confirm("Delete this task?")){active().tasks=active().tasks.filter(y=>y.id!==x.dataset.deleteTask);save();render()}});
 document.querySelectorAll("[data-edit-provider]").forEach(x=>x.onclick=()=>{modal={type:"provider",item:{...db.providers.find(y=>y.id===x.dataset.editProvider)}};render()});
 document.querySelectorAll("[data-delete-provider]").forEach(x=>x.onclick=()=>{if(confirm("Delete this provider? Assigned tasks will become unassigned.")){const pid=x.dataset.deleteProvider;db.providers=db.providers.filter(y=>y.id!==pid);db.projects.forEach(p=>p.tasks.forEach(t=>{if(t.provider===pid)t.provider=""}));save();render()}});
 document.querySelectorAll("[data-open-order]").forEach(x=>x.onclick=()=>{previewId=x.dataset.openOrder;render()});
 document.querySelectorAll("[data-print-order]").forEach(x=>x.onclick=()=>printOrder(x.dataset.printOrder));
 document.querySelectorAll("[data-share-order]").forEach(x=>x.onclick=()=>shareOrder(x.dataset.shareOrder));
 document.querySelectorAll("[data-edit-order]").forEach(x=>x.onclick=()=>{modal={type:"order",item:{...active().orders.find(y=>y.id===x.dataset.editOrder)}};previewId=null;render()});
 document.querySelectorAll("[data-delete-order]").forEach(x=>x.onclick=()=>{if(confirm("Delete this work order?")){active().orders=active().orders.filter(y=>y.id!==x.dataset.deleteOrder);save();render()}});
 document.querySelectorAll("[data-status]").forEach(x=>x.onchange=()=>{const o=active().orders.find(y=>y.id===x.dataset.status);o.status=x.value;save();render()});
 document.querySelectorAll("[data-action]").forEach(x=>x.onclick=()=>action(x.dataset.action));
 const ri=document.getElementById("restoreInput");ri.onchange=restoreFile
}
function action(a){const p=active();
 if(a==="extract"){if(!p.scope.trim())return toast("Add a scope of work first",true);if(p.tasks.length&&!confirm("Replace the current task pool with newly extracted tasks?"))return;p.tasks=parseScope(p.scope);p.orders=[];save();toast("Scope converted into editable tasks");render()}
 if(a==="generate")generate();
 if(a==="addTask"){modal={type:"task",item:{id:uid(),title:"",trade:"General",area:"",details:"",materials:"",provider:"",cost:0}};render()}
 if(a==="addProvider"){modal={type:"provider",item:{id:uid(),name:"",trade:"",contact:"",phone:"",email:""}};render()}
 if(a==="editProject"){modal={type:"project",item:{...p},isNew:false};render()}
 if(a==="newProject"){modal={type:"project",item:{id:uid(),name:"",number:"",client:"",address:"",contact:"",phone:"",start:"",end:"",access:"",scope:"",tasks:[],orders:[]},isNew:true};render()}
 if(a==="company"){modal={type:"company",item:{...db.company}};render()}
 if(a==="closeModal"){modal=null;render()}
 if(a==="closePreview"){previewId=null;render()}
 if(a==="saveTask"){const f=getFields();if(!f.title.trim())return toast("Task title is required",true);const item={...modal.item,...f,cost:Number(f.cost||0)},i=p.tasks.findIndex(x=>x.id===item.id);if(i>=0)p.tasks[i]=item;else p.tasks.push(item);modal=null;save();render();toast("Task saved")}
 if(a==="saveProvider"){const f=getFields();if(!f.name.trim()||!f.trade.trim())return toast("Company and trade are required",true);const item={...modal.item,...f},i=db.providers.findIndex(x=>x.id===item.id);if(i>=0)db.providers[i]=item;else db.providers.push(item);modal=null;save();render();toast("Provider saved")}
 if(a==="saveProject"){const f=getFields();if(!f.name.trim())return toast("Project name is required",true);const item={...modal.item,...f};if(modal.isNew){db.projects.push(item);db.active=item.id}else{const i=db.projects.findIndex(x=>x.id===item.id);db.projects[i]=item}modal=null;save();render();toast("Project saved")}
 if(a==="saveOrder"){const f=getFields(),i=p.orders.findIndex(x=>x.id===modal.item.id);p.orders[i]={...p.orders[i],...f};modal=null;save();render();toast("Work order saved")}
 if(a==="saveCompany"){db.company={...db.company,...getFields()};modal=null;save();render();toast("Company details saved")}
 if(a==="backup"){const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=`work-order-builder-backup-${new Date().toISOString().slice(0,10)}.json`;link.click();URL.revokeObjectURL(url);toast("Backup downloaded")}
 if(a==="restore")document.getElementById("restoreInput").click()
}
function restoreFile(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!x.projects||!x.providers)throw Error();if(confirm("Replace the current browser data with this backup?")){db=x;save();view="build";step=1;render();toast("Backup restored")}}catch(err){toast("This is not a valid Work Order Builder backup",true)}e.target.value=""};reader.readAsText(file)}
render();
</script>
</body>
</html>
